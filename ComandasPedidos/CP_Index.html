function cardHTML(c){
  var idJ = jsq(c.idVenta);
  var estado = c.estadoEnvio;
  var lineas = (c.lineas||[]).map(function(l){
    var split = (l.partes && l.partes > 1)
      ? '<span class="linea-split" title="SKU dividido en '+l.partes+' líneas de factura; cantidad = suma real"><i class="fa-solid fa-code-merge"></i> facturado en '+l.partes+'</span>' : '';
    return '<div class="linea"><div class="linea-sku" title="'+esc(l.sku)+'">'+esc(l.sku||'—')+'</div>'+
      '<div class="linea-cant">'+esc(l.cantidad||'—')+'</div>'+
      '<div class="linea-desc" title="'+esc(l.descripcion)+'">'+esc(l.descripcion||'—')+'</div>'+split+
      '<div class="linea-tot">'+esc(l.totalUSDStr)+'</div></div>';
  }).join('');
  var pills = '';
  if (c.rtv)            pills += pill(c.rtv, 'RTV');
  if (c.aprobComercial) pills += pill(c.aprobComercial, 'Aprob. Comercial');
  if (c.entregadosFuera) pills += '<span class="pill entr"><i class="fa-solid fa-circle-check"></i> '+c.entregadosFuera+' entregado'+(c.entregadosFuera===1?'':'s')+' fuera del sistema</span>';
  pills = pills ? '<div class="pills">'+pills+'</div>' : '';

  var nItems = (c.lineas||[]).length;
  var cliente = c.razonSocial || c.reseller || '—';
  var sub = '<b>'+esc(cliente)+'</b>'+(c.reseller&&c.razonSocial?' · '+esc(c.reseller):'')+
            ' · '+nItems+' ítem'+(nItems===1?'':'s')+' · <span class="usd">'+esc(c.totalUSDStr)+'</span>';

  var aging = c.cargadoTs
    ? '<span class="aging '+agingClass(c.cargadoTs)+'" data-ts="'+c.cargadoTs+'" title="Pendiente desde que se marcó CARGAR"><i class="fa-regular fa-clock"></i> '+agingStr(c.cargadoTs)+'</span>'
    : '<span class="aging none"><i class="fa-regular fa-clock"></i> s/f</span>';

  var cargadoRow;
  if (c.cargadoStr){
    var lbl = c.cargadoExacto ? 'Marcado CARGAR' : 'Detectado CARGAR ≈';
    var val = (c.cargadoRango ? esc(c.cargadoStr)+' → '+esc(c.cargadoHasta) : esc(c.cargadoStr)) +
              (c.cargadoTs ? ' <span style="color:var(--tx-d);font-weight:400">('+esc(relTime(c.cargadoTs))+')</span>' : '');
    cargadoRow = '<div class="ficha-row"><span class="ficha-lbl"><i class="fa-regular fa-clock" style="color:var(--blue);margin-right:5px"></i>'+lbl+'</span><span class="ficha-val">'+val+'</span></div>';
  } else {
    cargadoRow = '<div class="ficha-row"><span class="ficha-lbl"><i class="fa-regular fa-clock" style="color:var(--tx-d);margin-right:5px"></i>Marcado CARGAR</span><span class="ficha-val" style="color:var(--tx-d);font-weight:400">sin registro</span></div>';
  }

  var nEnv = (c.envios||[]).length, nFalta = (c.pending||[]).length;
  // progreso enviado/total (por cantidad)
  var totQ = (c.cargar||[]).reduce(function(a,it){ return a + (it.cantNum||0); }, 0);
  var pendQ = (c.pending||[]).reduce(function(a,it){ return a + (it.cantNum||0); }, 0);
  var envQ = Math.max(0, Math.round((totQ - pendQ)*100)/100);
  var pct = totQ > 0 ? Math.round(envQ/totQ*100) : 0;
  var progCls = pct===0 ? 'zero' : (pct>=100 ? '' : 'part');
  var progHTML = totQ > 0
    ? '<div class="prog" title="'+fmtCant(envQ)+' de '+fmtCant(totQ)+' unidades enviadas"><div class="prog-bar"><div class="prog-fill '+progCls+'" style="width:'+pct+'%"></div></div><div class="prog-lbl">'+fmtCant(envQ)+'/'+fmtCant(totQ)+'</div></div>'
    : '';
  var headRight;
  if (estado === 'completo'){
    headRight = progHTML + '<span class="b-cargado"><i class="fa-solid fa-circle-check"></i> Completa</span><span class="cmd-op">'+nEnv+' envío'+(nEnv===1?'':'s')+'</span>';
  } else if (estado === 'parcial'){
    headRight = aging + progHTML + '<span class="b-falta"><i class="fa-solid fa-triangle-exclamation"></i> Falta '+nFalta+'</span><span class="cmd-op">'+nEnv+' envío'+(nEnv===1?'':'s')+'</span>';
  } else {
    headRight = aging;
  }

  // control "armar envío" (pendiente / parcial)
  var envioControl = '';
  if (estado !== 'completo'){
    // ¿qué SKU son componentes de un kit? (para el tag "de kit")
    var kitBy = {};
    (c.cargar||[]).forEach(function(it){ kitBy[String(it.sku).toUpperCase()] = !it.noKit; });
    var pend = c.pending || [];
    var pedLbl = (estado === 'pendiente') ? 'a enviar' : 'falta';   // nada enviado aún → "a enviar"; parcial → "falta"
    var ctrlItems = pend.map(function(it){
      var q = it.cantNum;
      var entr = !!it.entregado;
      var val = entr ? 0 : q;   // si ya figura ENTREGADO en la hoja, no lo re-envía por defecto
      var badge = entr ? '<span class="cc-entr" title="Marcado ENTREGADO en PENDIENTES_ENTREGA'+(it.entregadoFecha?' · '+esc(it.entregadoFecha):'')+'"><i class="fa-solid fa-circle-check"></i> entregado</span>' : '';
      var deKit = kitBy[String(it.sku).toUpperCase()] ? '<span class="cc-flag" title="Componente de un kit explotado">de kit</span>' : '';
      return '<div class="cc-item'+(entr?' is-entr':'')+'">'+
        '<span class="cc-sku cc-copy" data-mck="'+esc(c.idVenta+'##'+(it.sku||''))+'" data-txt="'+esc(it.sku||'')+'" onclick="cargarFila(event,this)" title="Copiar el SKU y marcarlo como cargado en Masterchief">'+esc(it.sku||'—')+' <i class="fa-regular fa-copy cc-copy-hint"></i><i class="fa-solid fa-check cc-done-mark"></i></span>'+
        '<span class="cc-desc" title="'+esc(it.descripcion)+'">'+esc(it.descripcion||'')+'</span>'+
        deKit+
        badge+
        '<span class="cc-ped">'+pedLbl+' '+esc(it.cantidad)+'</span>'+
        '<div class="cc-step">'+
          '<button type="button" class="cc-step-b" tabindex="-1" title="Restar 1" onclick="ccStep(event,this,-1)">−</button>'+
          '<input class="cc-in" type="number" min="0" max="'+q+'" step="any" value="'+val+'" data-sku="'+esc(it.sku)+'" data-ped="'+q+'" onclick="event.stopPropagation()" oninput="ccMark(this)">'+
          '<button type="button" class="cc-step-b" tabindex="-1" title="Sumar 1" onclick="ccStep(event,this,1)">+</button>'+
        '</div>'+
        '<span class="cc-falta">queda 0</span>'+
        '<button type="button" class="cc-excl" tabindex="-1" title="No enviar este ítem ahora (poné 0)" onclick="ccToggleExcl(event,this)"><i class="fa-solid fa-ban"></i></button>'+
        '</div>';
    }).join('');
    envioControl =
      '<div class="cargar-box ctrl" data-id="'+esc(c.idVenta)+'" data-venta="'+esc(c.idVenta)+'" onclick="event.stopPropagation()">'+
        '<div class="cargar-head"><span><i class="fa-solid fa-clipboard-check"></i> '+(nEnv?'Nuevo envío':'Armar envío')+' <span style="font-weight:400;color:var(--tx-d)">— tocá el SKU para cargarlo en Masterchief y poné cuánto enviás</span> <span class="carg-count"></span></span>'+
          '<button class="carg-reset" style="display:none" onclick="reiniciarCargados(event,\''+idJ+'\')">reiniciar</button></div>'+
        '<div class="cc-list">'+ctrlItems+'</div>'+
        '<div class="env-form">'+
          '<div class="cmd-mark"><input class="cmd-comanda" type="text" inputmode="numeric" placeholder="N° comanda de este envío" oninput="validarComanda(this)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();crearEnvio(\''+idJ+'\',this);}"></div>'+
          '<div class="dup-note"></div>'+
          '<div class="bq-note"><i class="fa-solid fa-hourglass-half"></i> La guía puede tardar hasta ~30 min en aparecer luego de cargar la comanda (BigQuery).</div>'+
          '<div class="pdf-note"></div>'+
          '<div class="nota-item"><label><i class="fa-solid fa-user-check"></i> Mensaje para el aprobador (Sole)</label><textarea class="nota-aprob" rows="2" placeholder="Opcional — mail de aprobación"></textarea></div>'+
          '<div class="nota-item"><label><i class="fa-solid fa-store"></i> Mensaje para el Reseller</label><textarea class="nota-reseller" rows="2" placeholder="Opcional — mail final al reseller"></textarea></div>'+
          '<div class="crear-hint"></div>'+
          '<button class="btn-markbody btn-crear" disabled onclick="crearEnvio(\''+idJ+'\',this)"><i class="fa-solid fa-paper-plane"></i> Crear envío</button>'+
        '</div>'+
      '</div>';
  }

  // envíos ya hechos
  var enviosBox = '';
  if (c.envios && c.envios.length){
    enviosBox = '<div class="sec-lbl">Envíos realizados ('+c.envios.length+')</div>' +
      c.envios.map(function(e){ return envioBlockHTML(c, e, idJ); }).join('');
  }


  var claseEstado = estado==='completo' ? ' is-cargado' : '';
  return '<div class="cmd'+claseEstado+'" data-key="v:'+esc(c.idVenta)+'">'+
    '<div class="cmd-head" onclick="toggle(this)">'+
      '<div class="cmd-sum"><div class="cmd-sum-top">'+
        '<span class="cmd-id">'+esc(c.idVenta)+'</span>'+ copyChip(c.idVenta,'ID de venta')+
        (c.operacion ? '<span class="cmd-op">'+esc(c.operacion)+'</span>' : '')+
      '</div><div class="cmd-sub">'+sub+'</div></div>'+
      headRight+'<i class="fa-solid fa-chevron-down chev"></i>'+
    '</div>'+
    '<div class="cmd-body">'+
      '<div class="ficha">'+row('Reseller', c.reseller)+row('Razón Social', c.razonSocial)+cargadoRow+'</div>'+
      pills+
      envioControl+
      enviosBox+
      '<details class="pedido-det"><summary>Ver detalle de facturación ('+nItems+' ítem'+(nItems===1?'':'s')+')</summary>'+
        '<div class="lineas">'+lineas+'</div>'+
        '<div class="tot-row"><span class="tot-ars">'+esc(c.totalARSStr)+'</span><span class="tot-usd">'+esc(c.totalUSDStr)+'</span></div>'+
      '</details>'+
      (c.comentarios ? '<div class="coment"><b>Comentarios:</b> '+esc(c.comentarios)+'</div>' : '')+
    '</div>'+
  '</div>';
}

function row(lbl, val){
  return '<div class="ficha-row"><span class="ficha-lbl">'+esc(lbl)+'</span><span class="ficha-val">'+esc(val||'—')+'</span></div>';
}
function pill(val, lbl){
  var v = String(val).toLowerCase();
  var cls = /ok|aprob|si|sí|listo|acred/.test(v) ? 'ok' : (/pend|falta|no|revis/.test(v) ? 'warn' : '');
  return '<span class="pill '+cls+'">'+esc(lbl)+': '+esc(val)+'</span>';
}
function mostrarError(msg){
  document.getElementById('content').innerHTML = '<div class="err-box"><i class="fa-solid fa-circle-exclamation"></i> '+esc(msg)+'</div>';
}
var _open = {};   // data-key -> true (estado abierto, se preserva entre refreshes)
function toggle(headEl){
  var card = headEl.parentNode;
  var abierto = card.classList.toggle('open');
  var k = card.getAttribute('data-key');
  if (k){ if (abierto) _open[k] = true; else delete _open[k]; }
  sincToggleBtn();
}
function toggleTodo(){
  var cards = document.querySelectorAll('.cmd');
  var algunaCerrada = Array.prototype.some.call(cards, function(c){ return !c.classList.contains('open'); });
  Array.prototype.forEach.call(cards, function(c){
    c.classList.toggle('open', algunaCerrada);
    var k = c.getAttribute('data-key');
    if (k){ if (algunaCerrada) _open[k] = true; else delete _open[k]; }
  });
  sincToggleBtn();
}
// re-aplica el estado abierto guardado (tras cada render/refresh)
function restaurarAbiertas(){
  Array.prototype.forEach.call(document.querySelectorAll('.cmd[data-key]'), function(c){
    if (_open[c.getAttribute('data-key')]) c.classList.add('open');
  });
}
function sincToggleBtn(){
  var btn = document.getElementById('btn-toggle-all'); if (!btn) return;
  var cards = document.querySelectorAll('.cmd');
  var todasAbiertas = cards.length > 0 && Array.prototype.every.call(cards, function(c){ return c.classList.contains('open'); });
  btn.innerHTML = todasAbiertas ? '<i class="fa-solid fa-angles-up"></i> Colapsar todo' : '<i class="fa-solid fa-angles-down"></i> Expandir todo';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
function jsq(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
var _toastT = null;
function toast(msg, tipo, ico){
  var el = document.getElementById('toast');
  el.className = 'toast show' + (tipo ? ' '+tipo : '');
  el.innerHTML = (ico ? '<span>'+ico+'</span>' : '') + '<span>'+esc(msg)+'</span>';
  clearTimeout(_toastT);
  _toastT = setTimeout(function(){ el.className = 'toast'; }, 2600);
}
function fmtCant(n){ return (Math.round(n*100)/100).toLocaleString('es-AR',{maximumFractionDigits:2}); }

function comandaValida(v){ v=(v||'').trim(); return /^\d{5,}(\/\d{5,})*$/.test(v); }
var _pdfT = null;
function validarComanda(inp){
  var limpio = inp.value.replace(/[^0-9/]/g,'');
  if (limpio !== inp.value) inp.value = limpio;
  var ok = comandaValida(limpio);
  var card = inp.closest('.cmd');
  sincCrearBtn(card);
  var form = inp.closest('.env-form');
  // aviso EN VIVO si la comanda ya se usó en otro envío (antes de crear)
  var dup = form ? form.querySelector('.dup-note') : null;
  if (dup){
    var usada = ok ? comandaUsada(limpio) : null;
    if (usada){ dup.className = 'dup-note show'; dup.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Esta comanda ya se usó en la venta '+esc(usada); }
    else { dup.className = 'dup-note'; dup.innerHTML = ''; }
  }
  var note = form ? form.querySelector('.pdf-note') : null;
  if (note){
    clearTimeout(_pdfT);
    if (!ok){ note.className = 'pdf-note'; note.innerHTML = ''; }
    else { _pdfT = setTimeout(function(){ chequearPdf(limpio, note); }, 600); }
  }
}
// ¿está el PDF de la comanda en Drive? (el PDF sí llega rápido, no depende de BigQuery)
function chequearPdf(comanda, note){
  note.className = 'pdf-note show';
  note.innerHTML = '<i class="fa-solid fa-spinner" style="animation:sp .8s linear infinite"></i> Buscando PDF en Drive…';
  google.script.run
    .withSuccessHandler(function(r){
      if (!r || !r.ok){ note.className = 'pdf-note'; note.innerHTML = ''; return; }
      if (r.todos){ note.className = 'pdf-note ok'; note.innerHTML = '<i class="fa-solid fa-file-pdf"></i> PDF encontrado en Drive'; }
      else { note.className = 'pdf-note warn'; note.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> PDF '+esc((r.falta||[]).join(', '))+' todavía no está en Drive — el mail a Sole irá sin adjunto'; }
    })
    .withFailureHandler(function(){ note.className = 'pdf-note'; note.innerHTML = ''; })
    .CP_checkPdf(comanda);
}
function _partes(s){ return (s||'').split('/').map(function(x){ return x.trim(); }).filter(Boolean); }
// ¿la comanda ya está usada en algún envío (de cualquier venta)? → devuelve idVenta o null
function comandaUsada(val){
  var mine = _partes(val), dup = null;
  (_data||[]).forEach(function(c){
    (c.envios||[]).forEach(function(e){
      if (dup) return;
      if (_partes(e.comanda).some(function(x){ return mine.indexOf(x) > -1; })) dup = c.idVenta;
    });
  });
  return dup;
}

// actualiza en vivo el "queda N" al escribir cuánto se envía
function ccMark(input){
  var falta = parseFloat(input.getAttribute('data-ped')) || 0;
  var env = parseFloat(input.value); if (isNaN(env)) env = 0;
  if (env < 0) env = 0; if (env > falta){ env = falta; input.value = falta; }
  var queda = Math.round((falta - env)*100)/100;
  var item = input.closest('.cc-item');
  var lbl = item ? item.querySelector('.cc-falta') : null;
  if (lbl){ lbl.textContent = queda > 0 ? ('queda '+fmtCant(queda)) : 'todo'; lbl.classList.toggle('on', queda > 0); }
  if (item) item.classList.toggle('excl', env === 0);   // 0 = excluido de este envío
  sincCrearBtn(input.closest('.cmd'));
}
// stepper +/- de la cantidad a enviar
function ccStep(ev, btn, dir){
  ev.stopPropagation();
  var wrap = btn.closest('.cc-step');
  var inp = wrap ? wrap.querySelector('.cc-in') : null;
  if (!inp) return;
  var ped = parseFloat(inp.getAttribute('data-ped')) || 0;
  var v = (parseFloat(inp.value) || 0) + dir;
  if (v < 0) v = 0; if (v > ped) v = ped;
  inp.value = Math.round(v*100)/100;
  ccMark(inp);
}
// excluir/incluir un ítem: 0 ⇄ cantidad completa
function ccToggleExcl(ev, btn){
  ev.stopPropagation();
  var item = btn.closest('.cc-item');
  var inp = item ? item.querySelector('.cc-in') : null;
  if (!inp) return;
  var ped = parseFloat(inp.getAttribute('data-ped')) || 0;
  inp.value = (parseFloat(inp.value) || 0) === 0 ? ped : 0;   // si está en 0 → restaurar; si no → 0
  ccMark(inp);
}
// habilita "Crear envío" sólo si hay comanda válida Y algo para enviar; muestra el motivo si falta algo
function sincCrearBtn(card){
  if (!card) return;
  var btn = card.querySelector('.btn-crear'); if (!btn) return;
  var inp = card.querySelector('.cmd-comanda');
  var hint = card.querySelector('.crear-hint');
  var comOk = comandaValida((inp && inp.value || '').trim());
  var qtyOk = leerProductosCard(card).total > 0;
  var ok = comOk && qtyOk;
  btn.disabled = !ok;
  if (hint){
    var motivo = !qtyOk ? 'Poné cuánto enviás de al menos un producto' : (!comOk ? 'Falta el N° de comanda de este envío' : '');
    hint.textContent = motivo;
    hint.style.display = ok ? 'none' : 'block';
  }
}

// lee cuánto se envía de cada SKU (los inputs del control)
function leerProductosCard(card){
  var prod = {}, total = 0;
  if (card) card.querySelectorAll('.cargar-box.ctrl .cc-in').forEach(function(inp){
    var v = parseFloat(inp.value); if (isNaN(v) || v <= 0) return;
    prod[inp.getAttribute('data-sku')] = v; total += v;
  });
  return { prod: prod, total: total };
}

// crear un envío (comanda + productos a enviar ahora + notas)
function crearEnvio(idVenta, el, force){
  var card = el && el.closest ? el.closest('.cmd') : null;
  var inputEl = card ? card.querySelector('.cmd-comanda') : null;
  var val = (inputEl && inputEl.value || '').trim();
  if (!val){ if(inputEl) inputEl.focus(); toast('Ingresá el N° de comanda del envío', 'err', '✕'); return; }
  if (!comandaValida(val)){ if(inputEl) inputEl.focus(); toast('N° de comanda inválido', 'err', '✕'); return; }
  var pr = leerProductosCard(card);
  if (!pr.total){ toast('Poné cuánto enviás de al menos un producto', 'err', '✕'); return; }

  var _go = function(forzar){
    var notaAprob    = card ? ((card.querySelector('.nota-aprob')||{}).value||'').trim() : '';
    var notaReseller = card ? ((card.querySelector('.nota-reseller')||{}).value||'').trim() : '';
    var btn = card ? card.querySelector('.btn-crear') : null;
    var origBtn = btn ? btn.innerHTML : '';
    if (btn){ btn.disabled = true; btn.classList.add('loading'); btn.innerHTML = '<i class="fa-solid fa-spinner"></i> Creando envío…'; }
    if (inputEl) inputEl.disabled = true;
    var enable = function(){ if(btn){ btn.disabled=false; btn.classList.remove('loading'); btn.innerHTML=origBtn; } if(inputEl) inputEl.disabled=false; };
    google.script.run
      .withSuccessHandler(function(r){
        if (r && r.ok){
          var extra;
          if (r.mailSole) extra = ' · aviso a Sole'+(r.mailSoleSinPdf?' (sin PDF adjunto)':'');
          else if (r.mailSoleError) extra = ' · Sole NO avisado: '+r.mailSoleError;
          else extra = '';
          toast('Envío '+r.envio+' creado'+(r.completo?' · venta completa':'')+extra, 'ok', '✅'); cargar();
        } else if (r && r.yaUsada){
          enable();
          uiConfirm('⚠️ '+(r.mensaje||'Comanda ya usada')+'\n¿Crear el envío igual?', {danger:true, yes:'Crear igual'}).then(function(ok){ if (ok) _go(true); });
        } else { toast((r && r.mensaje) || 'No se pudo crear el envío', 'err', '✕'); enable(); }
      })
      .withFailureHandler(function(e){ toast('Error: '+((e&&e.message)||''), 'err', '✕'); enable(); })
      .CP_crearEnvio(idVenta, val, pr.prod, notaAprob, notaReseller, !!forzar);
  };

  if (!force){
    var dup = comandaUsada(val);
    if (dup){
      uiConfirm('⚠️ La comanda '+val+' ya se usó en un envío ('+dup+').\n¿Usarla igual?', {danger:true, yes:'Usar igual'})
        .then(function(ok){ if (ok) _go(true); else if (inputEl) inputEl.focus(); });
      return;
    }
  }
  _go(force);
}

// mail al reseller de un envío
function enviarMailEnvio(idVenta, envio, yaEnviado, btn){
  var msg = yaEnviado ? '⚠️ Este mail YA se envió. ¿Reenviarlo igual?' : '¿Enviar el mail de despacho al reseller y RTV?';
  uiConfirm(msg, { danger: !!yaEnviado, yes: yaEnviado ? 'Reenviar' : 'Enviar' }).then(function(ok){
    if (!ok) return;
    var orig = btn ? btn.innerHTML : '';
    if (btn){ btn.classList.add('loading'); btn.innerHTML = '<i class="fa-solid fa-spinner"></i> Enviando…'; }
    var restore = function(){ if (btn){ btn.classList.remove('loading'); btn.innerHTML = orig; } };
    toast('Enviando mail…', '', '✉️');
    google.script.run
      .withSuccessHandler(function(r){
        if (r && r.ok){ toast('Mail enviado ('+(r.a||'destinatarios')+') → '+(r.destinatarios||''), 'ok', '✅'); cargar(); }
        else { toast((r && r.mensaje) || 'No se pudo enviar', 'err', '✕'); restore(); }
      })
      .withFailureHandler(function(e){ toast('Error: '+((e&&e.message)||''), 'err', '✕'); restore(); })
      .CP_enviarMailEnvio(idVenta, envio);
  });
}

// vista previa del mail al reseller (no envía)
var _pv = { id:'', envio:0, ya:false };
function previewMail(idVenta, envio, yaEnviado){
  _pv = { id:idVenta, envio:envio, ya:!!yaEnviado };
  var ov = document.getElementById('pv-overlay');
  var meta = document.getElementById('pv-meta');
  var frame = document.getElementById('pv-frame');
  var send = document.getElementById('pv-send');
  meta.innerHTML = '<i class="fa-solid fa-spinner" style="animation:sp .8s linear infinite"></i> Generando vista previa…';
  frame.srcdoc = '';
  send.disabled = true; send.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar ahora';
  ov.classList.add('show');
  google.script.run
    .withSuccessHandler(function(r){
      if (!r || !r.ok){ meta.innerHTML = '<span class="pv-warn">'+esc((r&&r.mensaje)||'No se pudo generar la vista previa')+'</span>'; return; }
      frame.srcdoc = r.html || '';
      var m = '<b>Asunto:</b> '+esc(r.asunto||'—')+'<br><b>Para:</b> '+esc(r.destinatarios||'—')+(r.a?' <span style="color:var(--tx-d)">('+esc(r.a)+')</span>':'');
      if (r.cc)  m += '<br><b>CC:</b> '+esc(r.cc);
      if (r.bcc) m += '<br><b>CCO:</b> '+esc(r.bcc);
      if (r.noDespachado) m += '<br><span class="pv-warn"><i class="fa-solid fa-triangle-exclamation"></i> Todavía no está marcado DESPACHADO en Comandas Master — no se podrá enviar.</span>';
      if (r.sinDestino) m += '<br><span class="pv-warn"><i class="fa-solid fa-triangle-exclamation"></i> Sin destinatarios cargados.</span>';
      meta.innerHTML = m;
      send.disabled = !!(r.noDespachado || r.sinDestino);
    })
    .withFailureHandler(function(e){ meta.innerHTML = '<span class="pv-warn">Error: '+esc((e&&e.message)||'')+'</span>'; })
    .CP_previewMailEnvio(idVenta, envio);
  // el botón "Enviar ahora" reutiliza el flujo normal
  send.onclick = function(){ cerrarPreview(); enviarMailEnvio(_pv.id, _pv.envio, _pv.ya, null); };
}
function cerrarPreview(){ document.getElementById('pv-overlay').classList.remove('show'); document.getElementById('pv-frame').srcdoc = ''; }

// ── REPORTE DE TIEMPOS (CARGAR → comanda cargada) ──
function hLegible(h){
  if (h == null) return '—';
  var m = Math.round(h*60);
  if (m < 60) return m+'m';
  var hh = Math.floor(m/60), mm = m%60;
  if (hh < 24) return hh+'h'+(mm?' '+mm+'m':'');
  var d = Math.floor(hh/24), rh = hh%24;
  return d+'d'+(rh?' '+rh+'h':'');
}
// Vista "Tiempos" (centro de comando) — se pinta dentro de #content, como cualquier otra
// solapa. Cachea el resultado en _tiemposData: cambiar de solapa y volver no vuelve a pedirlo
// al server (el auto-refresh de comandas cada 3 min tampoco lo toca); solo "Actualizar" de
// arriba fuerza un pedido nuevo.
function renderTiempos(cont){
  if (_tiemposData){ cont.innerHTML = renderTiemposDashboard(_tiemposData); return; }
  if (_tiemposCargando) return;
  _tiemposCargando = true;
  cont.innerHTML = '<div style="text-align:center;padding:70px 20px"><div class="spinner"></div><div class="st-sub">Calculando tiempos…</div></div>';
  google.script.run
    .withSuccessHandler(function(r){
      _tiemposCargando = false;
      if (!r || !r.ok){ cont.innerHTML = '<div class="err-box">'+esc((r&&r.mensaje)||'No se pudo generar el reporte')+'</div>'; return; }
      _tiemposData = r;
      if (_view === 'tiempos') cont.innerHTML = renderTiemposDashboard(r);
    })
    .withFailureHandler(function(e){
      _tiemposCargando = false;
      cont.innerHTML = '<div class="err-box">Error: '+esc((e&&e.message)||'')+'</div>';
    })
    .CP_reporteTiempos();
}
// botón "Actualizar" del centro de comando: tira la cache y vuelve a pedir
function actualizarTiemposDatos(){
  _tiemposData = null;
  render();
}
function descargarTiemposCSV(){
  if (_tiemposData) descargarReporteCSV(_tiemposData);
}
function renderTiemposDashboard(r){
  function cards(s, titulo, big){
    if (!s || !s.n) return '<div class="rep-sub">'+titulo+'</div><div class="rep-note">Sin datos todavía.</div>';
    return '<div class="rep-sub">'+titulo+' ('+s.n+' comanda'+(s.n===1?'':'s')+')</div>'+
      '<div class="rep-cards">'+
        '<div class="rep-card'+(big?' big':'')+'"><div class="rc-n">'+hLegible(s.prom)+'</div><div class="rc-l">Promedio</div></div>'+
        '<div class="rep-card"><div class="rc-n">'+hLegible(s.mediana)+'</div><div class="rc-l">Mediana</div></div>'+
        '<div class="rep-card"><div class="rc-n">'+hLegible(s.min)+'</div><div class="rc-l">Mínimo</div></div>'+
        '<div class="rep-card"><div class="rc-n">'+hLegible(s.max)+'</div><div class="rc-l">Máximo</div></div>'+
      '</div>';
  }
  // "¿Dónde está la demora?" — compara el promedio de las 3 etapas (comparables entre sí,
  // a diferencia de "primer"/"total" que son subconjunto/suma) y marca la más lenta en rojo.
  function bottleneck(){
    var etapas = [
      { s: r.resumen.todos,      icon: '📝', label: 'Cargar comanda' },
      { s: r.resumen.autorizar,  icon: '🔵', label: 'Autorización' },
      { s: r.resumen.despachar,  icon: '🟢', label: 'Despacho' }
    ];
    var conDatos = etapas.filter(function(e){ return e.s && e.s.n; });
    if (!conDatos.length) return '';
    var max  = Math.max.apply(null, conDatos.map(function(e){ return e.s.prom; }));
    var suma = conDatos.reduce(function(a, e){ return a + e.s.prom; }, 0);
    var peor = conDatos.slice().sort(function(a, b){ return b.s.prom - a.s.prom; })[0];
    var filas = etapas.map(function(e){
      if (!e.s || !e.s.n) {
        return '<div class="bn-row"><div class="bn-lbl">'+e.icon+' '+e.label+'</div><div class="bn-bar-wrap"></div><div class="bn-val"><span class="bn-note">sin datos</span></div></div>';
      }
      var pct = max > 0 ? Math.round((e.s.prom / max) * 100) : 0;
      var pctTotal = suma > 0 ? Math.round((e.s.prom / suma) * 100) : 0;
      var esPeor = (e === peor);
      return '<div class="bn-row">'+
        '<div class="bn-lbl">'+e.icon+' '+e.label+'</div>'+
        '<div class="bn-bar-wrap"><div class="bn-bar'+(esPeor?' bn-worst':'')+'" style="width:'+Math.max(pct,4)+'%"></div></div>'+
        '<div class="bn-val">'+hLegible(e.s.prom)+' <span class="bn-pct">('+pctTotal+'%)</span></div>'+
      '</div>';
    }).join('');
    return '<div class="bn-box">'+
      '<div class="bn-head">🔍 ¿Dónde está la demora?</div>'+
      '<div class="bn-callout">⚠️ La etapa más lenta es <b>'+esc(peor.label)+'</b> — en promedio <b>'+hLegible(peor.s.prom)+'</b> por comanda.</div>'+
      filas+
      '<div class="rep-note" style="margin-top:2px">Promedio de cada etapa por separado (no son acumulativas). El % es la parte del ciclo total que le toca a esa etapa.</div>'+
    '</div>';
  }
  // Tendencia semana a semana por etapa — ¿mejora o empeora? Es el ángulo que el "promedio
  // general" y el "top 5" no responden: si un cambio de proceso realmente funcionó o no.
  function tendenciaChart(){
    var t = r.tendencia || [];
    var series = [
      { key:'carga',      label:'Cargar comanda', color:'var(--blue)' },
      { key:'autorizar',  label:'Autorización',   color:'var(--yellow)' },
      { key:'despachar',  label:'Despacho',       color:'var(--green)' }
    ];
    var conDatos = t.filter(function(w){ return series.some(function(s){ return w[s.key] != null; }); });
    if (conDatos.length < 2) {
      return '<div class="tr-box"><div class="bn-head">📈 Tendencia semana a semana</div>'+
        '<div class="rep-note">Todavía no hay suficientes semanas con datos para mostrar una tendencia (hacen falta al menos 2 semanas con comandas).</div></div>';
    }
    var W=640, H=200, padL=34, padR=12, padT=16, padB=26;
    var plotW = W-padL-padR, plotH = H-padT-padB, n = conDatos.length;
    var allVals = [];
    conDatos.forEach(function(w){ series.forEach(function(s){ if (w[s.key] != null) allVals.push(w[s.key]); }); });
    var maxVal = allVals.length ? Math.max.apply(null, allVals) : 1;
    maxVal = maxVal > 0 ? maxVal * 1.15 : 1;
    function xAt(i){ return n > 1 ? padL + i*(plotW/(n-1)) : padL + plotW/2; }
    function yAt(v){ return padT + plotH - (v/maxVal)*plotH; }

    var grid = [0,0.5,1].map(function(f){
      var y = padT + plotH - f*plotH;
      return '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="var(--brd)" stroke-width="1" stroke-dasharray="3,3"/>'+
             '<text x="'+(padL-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--tx-d)">'+esc(hLegible(maxVal*f))+'</text>';
    }).join('');

    var xlabels = conDatos.map(function(w,i){
      return '<text x="'+xAt(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="var(--tx-d)">'+esc(w.semanaStr)+'</text>';
    }).join('');

    var lineasHtml = series.map(function(s){
      var segs = [], cur = [];
      conDatos.forEach(function(w,i){
        if (w[s.key] == null) { if (cur.length) { segs.push(cur); cur = []; } return; }
        cur.push([xAt(i), yAt(w[s.key])]);
      });
      if (cur.length) segs.push(cur);
      var polys = segs.map(function(seg){
        var pts = seg.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
        return '<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
      }).join('');
      var dots = conDatos.map(function(w,i){
        if (w[s.key] == null) return '';
        return '<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(w[s.key]).toFixed(1)+'" r="3" fill="'+s.color+'"><title>'+esc(s.label)+' · semana del '+esc(w.semanaStr)+': '+esc(hLegible(w[s.key]))+'</title></circle>';
      }).join('');
      return polys+dots;
    }).join('');

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" class="tr-svg" preserveAspectRatio="xMidYMid meet">'+grid+lineasHtml+xlabels+'</svg>';

    // Veredicto por etapa: última semana con dato vs. la anterior (con dato) — menos horas = mejora.
    var leyenda = series.map(function(s){
      var conValor = conDatos.filter(function(w){ return w[s.key] != null; });
      var verdict = '<span class="tr-nd">sin comparación todavía</span>';
      if (conValor.length >= 2) {
        var last = conValor[conValor.length-1][s.key], prev = conValor[conValor.length-2][s.key];
        if (prev > 0) {
          var delta = Math.round(((last-prev)/prev)*100);
          if (delta <= -5)      verdict = '<span class="tr-mejor"><i class="fa-solid fa-arrow-down"></i> '+Math.abs(delta)+'% vs. semana anterior</span>';
          else if (delta >= 5)  verdict = '<span class="tr-peor"><i class="fa-solid fa-arrow-up"></i> +'+delta+'% vs. semana anterior</span>';
          else                  verdict = '<span class="tr-nd">≈ estable</span>';
        }
      }
      return '<div class="tr-leg-item"><span class="tr-dot" style="background:'+s.color+'"></span><b>'+esc(s.label)+'</b> '+verdict+'</div>';
    }).join('');

    return '<div class="tr-box">'+
      '<div class="bn-head">📈 Tendencia semana a semana</div>'+
      '<div class="tr-legend">'+leyenda+'</div>'+
      svg+
      '<div class="rep-note" style="margin-top:8px">Promedio por semana (agrupada por la fecha en que se marcó CARGAR). La flecha compara la última semana con datos contra la anterior — verde = mejoró (más rápido), rojo = empeoró (más lento).</div>'+
    '</div>';
  }
  // Top 5 comandas más lentas de punta a punta, con el detalle de cada etapa — para ir directo
  // a un caso concreto en vez de quedarse solo con el promedio general.
  function peoresTabla(){
    var p = r.peores || [];
    if (!p.length) return '';
    function celda(hVal, esMax){
      if (hVal == null) return '<td class="pt-td pt-na">—</td>';
      return '<td class="pt-td'+(esMax?' pt-max':'')+'">'+hLegible(hVal)+'</td>';
    }
    var filas = p.map(function(x){
      var vals = [x.horasCarga, x.horasAutorizar, x.horasDespachar].filter(function(v){ return v != null; });
      var max = vals.length ? Math.max.apply(null, vals) : null;
      return '<tr>'+
        '<td class="pt-td pt-comanda">'+esc(x.comanda||'—')+'</td>'+
        '<td class="pt-td"><div class="pt-reseller">'+esc(x.reseller||'—')+'</div><div class="pt-sub">'+esc(x.idVenta||'')+(x.idNegocio?' · Neg. '+esc(x.idNegocio):'')+'</div></td>'+
        celda(x.horasCarga, max != null && x.horasCarga === max)+
        celda(x.horasAutorizar, max != null && x.horasAutorizar === max)+
        celda(x.horasDespachar, max != null && x.horasDespachar === max)+
        '<td class="pt-td pt-total">'+hLegible(x.horasTotal)+'</td>'+
      '</tr>';
    }).join('');
    return '<div class="pt-box">'+
      '<div class="bn-head">🐢 Top 5 más lentas (ciclo completo)</div>'+
      '<div class="pt-scroll"><table class="pt-table">'+
        '<thead><tr><th>Comanda</th><th>Reseller / Venta</th><th>Cargar</th><th>Autorizar</th><th>Despachar</th><th>Total</th></tr></thead>'+
        '<tbody>'+filas+'</tbody>'+
      '</table></div>'+
      '<div class="rep-note" style="margin-top:8px">En rojo, la etapa que más aportó a la demora de esa comanda puntual — para saber a qué caso concreto ir a preguntar.</div>'+
    '</div>';
  }
  var head = '<div class="cc-head">'+
    '<div>'+
      '<div class="cc-title"><i class="fa-solid fa-gauge-high"></i> Centro de Comando · Tiempos</div>'+
      (r.desde ? '<div class="cc-desde">📅 Mide desde el <b>'+esc(r.desde)+'</b> en adelante — autorizaciones anteriores excluidas (los nombres de estado en Comandas Master cambiaron con el tiempo y ensuciaban los datos viejos).</div>' : '')+
    '</div>'+
    '<div class="cc-actions">'+
      '<button class="btn-out" onclick="actualizarTiemposDatos()" title="Volver a pedir los datos al servidor"><i class="fa-solid fa-rotate"></i> Actualizar</button>'+
      '<button class="btn-out" id="cc-btn-hoja" onclick="actualizarHojaTiempos()" title="Vuelca este mismo detalle a la pestaña TIEMPOS del spreadsheet de log"><i class="fa-solid fa-table"></i> Actualizar hoja TIEMPOS</button>'+
      '<button class="btn-mail" onclick="descargarTiemposCSV()"><i class="fa-solid fa-file-csv"></i> Descargar CSV</button>'+
    '</div>'+
  '</div>';

  var np = (r.pendientes||[]).length;
  if (!(r.rows||[]).length && !np){
    return head+'<div class="cc-empty"><i class="fa-solid fa-hourglass-half"></i>Todavía no hay datos para medir desde el '+esc(r.desde||'hoy')+'.<br>Van a empezar a aparecer apenas se cargue la primera comanda y salga el primer mail de autorización.</div>';
  }

  var kCarga = r.resumen.todos, kAut = r.resumen.autorizar, kDesp = r.resumen.despachar, kTotal = r.resumen.total;
  var kpis = '<div class="cc-kpis">'+
    '<div class="cc-kpi"><div class="cc-kpi-n">'+(kCarga.n?hLegible(kCarga.prom):'—')+'</div><div class="cc-kpi-l">📝 Cargar comanda</div></div>'+
    '<div class="cc-kpi"><div class="cc-kpi-n">'+(kAut.n?hLegible(kAut.prom):'—')+'</div><div class="cc-kpi-l">🔵 Autorización</div></div>'+
    '<div class="cc-kpi"><div class="cc-kpi-n">'+(kDesp.n?hLegible(kDesp.prom):'—')+'</div><div class="cc-kpi-l">🟢 Despacho</div></div>'+
    '<div class="cc-kpi cc-kpi-hi"><div class="cc-kpi-n">'+(kTotal.n?hLegible(kTotal.prom):'—')+'</div><div class="cc-kpi-l">🏁 TOTAL ciclo</div></div>'+
    '<div class="cc-kpi'+(np?' cc-kpi-warn':'')+'"><div class="cc-kpi-n">'+np+'</div><div class="cc-kpi-l">⏳ Sin cargar comanda</div></div>'+
  '</div>';

  var detalle = '<div class="tr-box"><div class="bn-head">📊 Detalle estadístico por etapa</div>'+
    cards(r.resumen.primer, '1️⃣ CARGAR → primera comanda (tiempo de arranque)', true)+
    cards(r.resumen.todos, '1️⃣ CARGAR → comanda (todas)', false)+
    cards(r.resumen.autorizar, '2️⃣ Comanda → autorización (guía asignada en Masterchief)', false)+
    cards(r.resumen.despachar, '3️⃣ Autorización → despacho', false)+
    cards(r.resumen.total, '🏁 TOTAL: CARGAR → despacho (ciclo completo)', true)+
  '</div>';

  var html = head+kpis+
             '<div class="cc-grid2">'+tendenciaChart()+bottleneck()+'</div>'+
             peoresTabla()+
             detalle;
  if (np){
    var mx = r.pendientes[0];
    html += '<div class="rep-note rep-warn"><b>'+np+'</b> venta'+(np===1?'':'s')+' marcada'+(np===1?'':'s')+' CARGAR sin cargar la comanda todavía · la más vieja lleva <b>'+hLegible(mx.horasAbierto)+'</b> ('+esc(mx.idVenta)+').</div>';
  }
  html += '<div class="rep-note" style="margin-top:10px">Los tramos 2 y 3 se detectan con el cron de mails (corre cada ≤30 min), así que tienen ese margen de error — igual que el tramo 1 cuando el origen es <b>aprox</b> (detección, no edición en vivo).</div>';
  return html;
}
function descargarReporteCSV(r){
  var rows = [['ID_Venta','ID_Negocio','Reseller','Razon_Social','Envio','Comanda','Operador','CARGAR','Origen','Comanda_cargada','Horas_carga','Autorizado','Horas_autorizar','Despachado','Horas_despachar','Horas_total','Primer_envio']];
  (r.rows||[]).forEach(function(x){
    rows.push([x.idVenta, x.idNegocio||'', x.reseller, x.cliente, x.envio, x.comanda, x.operador, x.cargarStr, x.origen, x.cargadaStr,
               (x.horasCarga==null?'':x.horasCarga), x.autorizadoStr||'', (x.horasAutorizar==null?'':x.horasAutorizar),
               x.despachadoStr||'', (x.horasDespachar==null?'':x.horasDespachar), (x.horasTotal==null?'':x.horasTotal),
               (x.primero?'SI':'NO')]);
  });
  descargarCSV(rows, 'reporte_tiempos_');
  toast('Reporte descargado', 'ok', '✅');
}

// export CSV de lo pendiente de enviar (1 producto por línea) — se arma en el cliente desde _data
function exportarFaltantes(){
  var rows = [['ID_Venta','SKU','Descripcion','Cantidad_pendiente','Reseller','Razon_Social','Estado_envio']];
  (_data||[]).forEach(function(c){
    (c.pending||[]).forEach(function(p){
      rows.push([c.idVenta, p.sku, p.descripcion, p.cantidad, c.reseller||'', c.razonSocial||'', c.estadoEnvio]);
    });
  });
  if (rows.length === 1){ toast('No hay productos pendientes de enviar', '', 'ℹ️'); return; }
  descargarCSV(rows, 'faltantes_');
  toast((rows.length-1)+' línea(s) exportadas', 'ok', '✅');
}
function csvCell(v){
  v = String(v==null?'':v);
  if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;   // anti CSV/Excel formula injection
  return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function descargarCSV(rows, prefijo){
  var csv = rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  var blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8;' });  // BOM para Excel
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = prefijo + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}

// borrar un envío
function borrarEnvio(idVenta, envio){
  uiConfirm('¿Borrar este envío? Los productos vuelven a quedar pendientes de enviar.', { danger:true, yes:'Borrar' }).then(function(ok){
    if (!ok) return;
    google.script.run
      .withSuccessHandler(function(r){
        if (r && r.ok){ toast('Envío borrado', 'ok', '↩'); cargar(); }
        else toast((r && r.mensaje) || 'No se pudo borrar', 'err', '✕');
      })
      .withFailureHandler(function(e){ toast('Error: '+((e&&e.message)||''), 'err', '✕'); })
      .CP_borrarEnvio(idVenta, envio);
  });
}

// reenviar el mail de aprobación a Sole
function reenviarAprobacion(idVenta, envio, btn){
  uiConfirm('¿Reenviar el mail de aprobación a Sole?', { yes:'Reenviar' }).then(function(ok){
    if (!ok) return;
    var orig = btn ? btn.innerHTML : '';
    if (btn){ btn.classList.add('loading'); btn.innerHTML = '<i class="fa-solid fa-spinner"></i> Reenviando…'; }
    var restore = function(){ if(btn){ btn.classList.remove('loading'); btn.innerHTML=orig; } };
    google.script.run
      .withSuccessHandler(function(r){
        if (r && r.ok){ toast('Aprobación reenviada a Sole'+(r.sinPdf?' (sin PDF: no está en Drive)':''), r.sinPdf?'':'ok', r.sinPdf?'⚠️':'✅'); restore(); }
        else { toast((r && r.mensaje) || 'No se pudo reenviar', 'err', '✕'); restore(); }
      })
      .withFailureHandler(function(e){ toast('Error: '+((e&&e.message)||''), 'err', '✕'); restore(); })
      .CP_reenviarAprobacion(idVenta, envio);
  });
}

// export CSV de todos los envíos
function exportarEnvios(){
  var rows = [['ID_Venta','Envio','Comanda','Fecha','Operador','Productos','Guia','Transportista','Estado_despacho','Mail_reseller','Error_mail']];
  (_data||[]).forEach(function(c){
    (c.envios||[]).forEach(function(e){
      var prods = (e.items||[]).map(function(it){ return it.sku+':'+it.cantidad; }).join(' ; ');
      var guias = (e.guiasLinks||[]).map(function(g){ return g.guia; }).join(' / ');
      rows.push([c.idVenta, e.envio, e.comanda, e.fechaStr||'', e.operador||'', prods, guias,
                 e.transportista||'', e.estadoDespacho||'', e.mailReseller||'', e.mailError||'']);
    });
  });
  if (rows.length === 1){ toast('No hay envíos para exportar', '', 'ℹ️'); return; }
  descargarCSV(rows, 'envios_');
  toast((rows.length-1)+' envío(s) exportados', 'ok', '✅');
}

      else { toast((r && r.mensaje) || 'No se pudo guardar', 'err', '✕'); btn.disabled=false; }
    })
    .withFailureHandler(function(e){ toast('Error: '+((e&&e.message)||''), 'err', '✕'); btn.disabled=false; })
    .CP_setNotaResellerEnvio(idVenta, envio, val);
}

// copiar la lista "qué cargar" al portapapeles
// copia texto al portapapeles (con fallback) y ejecuta cb() cuando termina
function copiarTxt(txt, cb){
  var done = function(){ if (cb) cb(); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
  } else { fallbackCopy(txt); done(); }
}
// chip de copia (ícono) reutilizable: <button class="copy-ic" data-copy="..." onclick="copiarChip(event,this)">
function copiarChip(ev, el){
  ev.stopPropagation();
  copiarTxt(el.getAttribute('data-copy') || '', function(){
    var orig = el.innerHTML;
    el.innerHTML = '<i class="fa-solid fa-check"></i>'; el.classList.add('ok');
    setTimeout(function(){ el.innerHTML = orig; el.classList.remove('ok'); }, 1100);
  });
}
function copyChip(text, title){
  return '<button class="copy-ic" data-copy="'+esc(text)+'" onclick="copiarChip(event,this)" title="Copiar '+esc(title||'')+'"><i class="fa-regular fa-copy"></i></button>';
}

// ── "Qué cargar": copiar fila por fila y marcar como cargada ──
function cargarFila(ev, el){
  ev.stopPropagation();
  var key = el.getAttribute('data-mck');
  var done = !el.classList.contains('done');
  el.classList.toggle('done', done);
  if (done){ _cargadosMc[key] = true; copiarTxt(el.getAttribute('data-txt') || ''); }
  else delete _cargadosMc[key];
  var box = el.closest('.cargar-box');
  actualizarCargCount(box);
  // terminó de cargar todas las filas → llevar el foco al N° de comanda (próximo paso)
  if (done && box){
    var total = box.querySelectorAll('[data-mck]').length;
    var hechas = box.querySelectorAll('[data-mck].done').length;
    if (total && hechas === total){
      var comInp = box.querySelector('.cmd-comanda');
      if (comInp && !comInp.value){
        comInp.focus();
        comInp.classList.add('ready-glow');
        setTimeout(function(){ comInp.classList.remove('ready-glow'); }, 1600);
      }
    }
  }
}
function actualizarCargCount(box){
  if (!box) return;
  var total = box.querySelectorAll('[data-mck]').length;
  var done  = box.querySelectorAll('[data-mck].done').length;
  var lbl = box.querySelector('.carg-count');
  if (lbl) lbl.textContent = total ? ('· '+done+'/'+total+' cargados en MC') : '';
  var reset = box.querySelector('.carg-reset');
  if (reset) reset.style.display = done > 0 ? '' : 'none';
}
// re-aplica el estado "cargado" tras cada render (sobrevive al auto-refresh)
function restaurarCargados(){
  Array.prototype.forEach.call(document.querySelectorAll('.cargar-box [data-mck]'), function(el){
    if (_cargadosMc[el.getAttribute('data-mck')]) el.classList.add('done');
  });
  Array.prototype.forEach.call(document.querySelectorAll('.cargar-box'), function(box){ actualizarCargCount(box); });
}
function reiniciarCargados(ev, idVenta){
  ev.stopPropagation();
  var pref = idVenta + '##';
  Object.keys(_cargadosMc).forEach(function(k){ if (k.indexOf(pref) === 0) delete _cargadosMc[k]; });
  render();
}
function fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

// ── CONTADOR DE ANTIGÜEDAD (SLA) ──────────────────────────
// Umbrales en minutos: verde < warn ≤ amarillo < danger ≤ rojo.
// Ajustá estos dos valores según el SLA real de carga en Masterchief.
var AGING = { warn: 4*60, danger: 24*60 };  // 4 h / 24 h

function agingClass(ms){
  var min = (Date.now() - ms) / 60000;
  if (min >= AGING.danger) return 'rojo';
  if (min >= AGING.warn)   return 'amarillo';
  return 'verde';
}
// contador compacto: "45m" · "3h 12m" · "2d 4h"
function agingStr(ms){
  var m = Math.floor((Date.now() - ms) / 60000);
  if (m < 1)  return 'recién';
  if (m < 60) return m + 'm';
  var h = Math.floor(m/60), mm = m % 60;
  if (h < 24) return h + 'h' + (mm ? ' ' + mm + 'm' : '');
  var d = Math.floor(h/24), hh = h % 24;
  return d + 'd' + (hh ? ' ' + hh + 'h' : '');
}
// refresca todos los contadores en vivo (color + texto)
function tickAging(){
  var els = document.querySelectorAll('.aging[data-ts]');
  Array.prototype.forEach.call(els, function(el){
    var ts = parseInt(el.getAttribute('data-ts'), 10);
    if (!ts) return;
    el.className = 'aging ' + agingClass(ts);
    el.innerHTML = '<i class="fa-regular fa-clock"></i> ' + agingStr(ts);
  });
}

// tiempo relativo compacto a partir de epoch ms
function relTime(ms){
  if(!ms) return '';
  var diff = Date.now() - ms;
  if (diff < 0) diff = 0;
  var min = Math.floor(diff/60000);
  if (min < 1)  return 'recién';
  if (min < 60) return 'hace '+min+' min';
  var h = Math.floor(min/60);
  if (h < 24)   return 'hace '+h+' h';
  var d = Math.floor(h/24);
  if (d < 30)   return 'hace '+d+' día'+(d===1?'':'s');
  var mo = Math.floor(d/30);
  return 'hace '+mo+' mes'+(mo===1?'':'es');
}

// ── MODAL DE CONFIRMACIÓN (reemplaza confirm() nativo) ──
var _cfResolve = null;
function uiConfirm(msg, opts){
  opts = opts || {};
  return new Promise(function(resolve){
    _cfResolve = resolve;
    document.getElementById('cf-msg').textContent = msg;
    document.getElementById('cf-title').textContent = opts.title || 'Confirmar';
    var yes = document.getElementById('cf-yes');
    yes.textContent = opts.yes || 'Confirmar';
    yes.className = 'btn-mail' + (opts.danger ? ' danger' : '');
    document.getElementById('cf-no').textContent = opts.no || 'Cancelar';
    var ov = document.getElementById('cf-overlay');
    ov.classList.toggle('cf-overlay-danger', !!opts.danger);
    ov.classList.add('show');
    setTimeout(function(){ yes.focus(); }, 30);
  });
}
function cfResolver(val){
  document.getElementById('cf-overlay').classList.remove('show');
  var r = _cfResolve; _cfResolve = null;
  if (r) r(val);
}

// ── MENÚ HERRAMIENTAS ──
function toggleTools(ev){ if (ev) ev.stopPropagation(); document.getElementById('tools-menu').classList.toggle('show'); }
function closeTools(){ document.getElementById('tools-menu').classList.remove('show'); }
document.addEventListener('click', function(e){
  var w = document.querySelector('.tools-wrap');
  if (w && !w.contains(e.target)) closeTools();
});

// ── MODO OSCURO ──
function setTema(dark){
  document.body.classList.toggle('dark', dark);
  var ico = document.getElementById('tema-ico'), lbl = document.getElementById('tema-lbl');
  if (ico) ico.className = 'fa-solid ' + (dark ? 'fa-sun' : 'fa-moon');
  if (lbl) lbl.textContent = dark ? 'Modo claro' : 'Modo oscuro';
  try { localStorage.setItem('cp_tema', dark ? 'dark' : 'light'); } catch(_){}
}
function toggleTema(){ setTema(!document.body.classList.contains('dark')); }
function initTema(){ try { setTema(localStorage.getItem('cp_tema') === 'dark'); } catch(_){} }

// ── PREFERENCIAS (solapa + filtros) en localStorage ──
function guardarPrefs(){
  try { localStorage.setItem('cp_prefs', JSON.stringify({ view: _view, filtros: _filtros })); } catch(_){}
}
function cargarPrefs(){
  try {
    var p = JSON.parse(localStorage.getItem('cp_prefs') || '{}');
    if (p.view && ['pend','parcial','completo','envios','tiempos'].indexOf(p.view) > -1){
      _view = p.view;
      ['pend','parcial','completo','envios','tiempos'].forEach(function(x){ var b = document.getElementById('vtab-'+x); if (b) b.classList.toggle('active', _view === x); });
      _actualizarVisibilidadToolbar();
    }
    if (p.filtros){
      _filtros = { sla:!!p.filtros.sla, listos:!!p.filtros.listos, error:!!p.filtros.error, reseller:p.filtros.reseller || '' };
      ['sla','listos','error'].forEach(function(k){ var b = document.getElementById('fchip-'+k); if (b) b.classList.toggle('on', _filtros[k]); });
      actualizarClear();
    }
  } catch(_){}
}

// ── ATAJOS DE TECLADO ──
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (document.getElementById('cf-overlay').classList.contains('show')){ cfResolver(false); return; }
    if (document.getElementById('pv-overlay').classList.contains('show')){ cerrarPreview(); return; }
    if (document.getElementById('sm-overlay').classList.contains('show')){ cerrarSinMail(); return; }
    if (document.getElementById('ay-overlay').classList.contains('show')){ cerrarAyuda(); return; }
    if (document.getElementById('tools-menu').classList.contains('show')){ closeTools(); return; }
    return;
  }
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  var modalOpen = ['pv-overlay','sm-overlay','cf-overlay','ay-overlay'].some(function(id){ var o = document.getElementById(id); return o && o.classList.contains('show'); });
  if (modalOpen) return;
  if (e.key === '/'){ e.preventDefault(); var q = document.getElementById('q'); if (q) q.focus(); }
  else if (e.key === 'r' || e.key === 'R'){ cargar(); }
  else if (e.key >= '1' && e.key <= '5'){ switchView(['pend','parcial','completo','envios','tiempos'][(+e.key)-1]); }
});

// carga automática al abrir
initTema();
cargarPrefs();
cargar();

// contadores en vivo: refresca cada 30 s sin recargar datos del server
setInterval(tickAging, 30000);

// auto-refresh de datos cada 3 min: trae guías nuevas (BigQuery) sin apretar "Actualizar".
// Preserva la solapa activa, la búsqueda y las cards abiertas; se saltea si estás escribiendo
// o si la pestaña está oculta (nadie mira → no gastamos llamadas al server).
setInterval(function(){ if (!document.hidden && _puedeAutoRefresh()) cargar(true); }, 3*60000);
// al volver a la pestaña, refrescá al toque (así ves data fresca sin esperar el ciclo).
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && _puedeAutoRefresh()) cargar(true);
});
</script>

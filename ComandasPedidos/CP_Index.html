<!DOCTYPE html>
<!-- @version 2.27 -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --blue:   #00a3e0; --blue-d: #0088bb;
  --blue-a: rgba(0,163,224,.1); --blue-b: rgba(0,163,224,.05);
  --bg:     #f0f2f5; --panel:  #ffffff; --surf:  #f7f8fa;
  --raise:  #eef0f3; --hov:    #e8eaed; --brd:   #e0e3e8; --brd2:  #c8cdd6;
  --tx:     #1a1f2e; --tx-m:   #5e6778; --tx-d:  #9ba5b4;
  --green:  #1a9e4a; --yellow: #d4890a; --red:   #d63031; --amber:#ffab00;
  --f: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --r:4px; --rm:8px; --rl:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:var(--f);color:var(--tx);min-height:100vh;font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surf)}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--blue)}

/* ── HEADER ── */
.site-header{background:var(--panel);border-bottom:1px solid var(--brd);padding:12px 22px;position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.header-brand{display:flex;align-items:center;gap:10px}
.dji-mark{width:34px;height:34px;background:var(--blue);border-radius:var(--r);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dji-mark span{color:#fff;font-size:10px;font-weight:700;letter-spacing:.05em}
.header-name{font-size:13px;font-weight:600;color:var(--tx);line-height:1.2}
.header-sub{font-size:10px;color:var(--tx-m)}
.header-badge{font-size:9px;font-weight:700;letter-spacing:.1em;padding:4px 10px;border-radius:var(--r);background:var(--blue-a);color:var(--blue);border:1px solid rgba(0,163,224,.2);text-transform:uppercase}

/* ── LAYOUT ── */
.wrap{max-width:880px;margin:0 auto;padding:22px 16px 60px;transition:max-width .15s ease}
.wrap.wrap-wide{max-width:1180px}

/* ── HERO / RESUMEN ── */
.hero{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--brd);border-left:4px solid var(--amber);border-radius:var(--rl);padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hero-ico{width:46px;height:46px;border-radius:var(--rm);background:rgba(255,171,0,.12);color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.hero-txt{flex:1;min-width:0}
.hero-count{font-size:24px;font-weight:800;color:var(--tx);line-height:1.1}
.hero-count small{font-size:13px;font-weight:600;color:var(--tx-m)}
.hero-sub{font-size:12px;color:var(--tx-m);margin-top:2px}
.hero.ok{border-left-color:var(--green)}
.hero.ok .hero-ico{background:rgba(26,158,74,.12);color:var(--green)}

/* ── VIEW TABS (Pendientes / Cargados) ── */
.viewtabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--brd);border-radius:var(--rl);padding:4px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.vtab{flex:1;padding:9px 12px;background:transparent;border:none;color:var(--tx-m);font-size:12.5px;font-weight:600;border-radius:var(--rm);cursor:pointer;transition:all .13s;display:flex;align-items:center;justify-content:center;gap:8px}
.vtab:hover{background:var(--surf);color:var(--tx)}
.vtab.active{background:var(--blue);color:#fff}
.vcount{font-size:11px;font-weight:800;background:rgba(0,0,0,.12);padding:1px 8px;border-radius:10px;min-width:22px}
.vtab.active .vcount{background:rgba(255,255,255,.25)}

/* ── TOAST ── */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:#fff;padding:11px 18px;border-radius:var(--rm);font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:900;display:flex;align-items:center;gap:9px;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#127a38}
.toast.err{background:#b3282b}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-box{flex:1;min-width:180px;position:relative}
.search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx-d);font-size:13px}
.search-box input{width:100%;background:var(--panel);border:1px solid var(--brd);color:var(--tx);border-radius:var(--rm);padding:9px 12px 9px 34px;font-family:var(--f);font-size:13px;outline:none;transition:border-color .13s,box-shadow .13s}
.search-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-a)}
.btn-out{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;background:var(--panel);border:1px solid var(--brd);color:var(--tx-m);font-size:12px;font-weight:600;border-radius:var(--rm);cursor:pointer;transition:all .13s}
.btn-out:hover{border-color:var(--blue);color:var(--blue);background:var(--panel)}
.btn-out.spin i{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ts-lbl{font-size:11px;color:var(--tx-d);margin-left:auto}

/* ── FILTROS RÁPIDOS ── */
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters-lbl{color:var(--tx-d);font-size:13px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border:1px solid var(--brd);color:var(--tx-m);font-size:12px;font-weight:600;border-radius:20px;cursor:pointer;transition:all .13s}
.fchip:hover{border-color:var(--brd2);color:var(--tx)}
.fchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fchip.clear{border-style:dashed;color:var(--tx-d)}
.fchip.clear:hover{border-color:var(--red);color:var(--red)}
.fsel{background:var(--panel);border:1px solid var(--brd);color:var(--tx-m);font-size:12px;font-weight:600;border-radius:20px;padding:6px 12px;font-family:var(--f);cursor:pointer;outline:none;transition:border-color .13s;max-width:220px}
.fsel:focus{border-color:var(--blue)}

/* listado resellers sin mail */
.sm-item{border:1px solid var(--brd);border-radius:var(--rm);padding:10px 13px;margin-bottom:8px;background:var(--surf)}
.sm-item .sm-r{font-size:13px;font-weight:700;color:var(--tx)}
.sm-item .sm-v{font-size:11.5px;color:var(--tx-m);margin-top:3px}

/* ── COMANDA CARD ── */
.cmd{background:var(--panel);border:1px solid var(--brd);border-radius:var(--rl);margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden}
.cmd.open{box-shadow:0 2px 12px rgba(0,163,224,.1);border-color:var(--brd2)}
.cmd-head{padding:11px 15px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;transition:background .12s}
.cmd-head:hover{background:var(--surf)}
.cmd.open .cmd-head{border-bottom:1px solid var(--brd);background:var(--surf)}
.cmd-sum{flex:1;min-width:0}
.cmd-sum-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cmd-id{font-size:14px;font-weight:700;color:var(--blue);font-family:ui-monospace,Menlo,Consolas,monospace}
.cmd-op{font-size:10px;color:var(--tx-m);background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:2px 7px}
.cmd-sub{font-size:11.5px;color:var(--tx-m);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-sub b{color:var(--tx);font-weight:600}
.cmd-sub .usd{color:var(--green);font-weight:700}
.cmd-sub .cmd-time{color:var(--tx-d);font-weight:500}
.b-cargar{font-size:10px;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:var(--r);background:rgba(255,171,0,.12);color:#b57500;border:1px solid rgba(255,171,0,.4);text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;flex-shrink:0}
/* contador de antigüedad (SLA) */
.aging{flex:0 0 auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:var(--r);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid;font-variant-numeric:tabular-nums}
.aging.verde{color:var(--green);background:rgba(26,158,74,.1);border-color:rgba(26,158,74,.28)}
.aging.amarillo{color:var(--yellow);background:rgba(212,137,10,.1);border-color:rgba(212,137,10,.32)}
.aging.rojo{color:var(--red);background:rgba(214,48,49,.1);border-color:rgba(214,48,49,.32)}
.aging.rojo i{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.aging.none{color:var(--tx-d);background:var(--surf);border-color:var(--brd);font-weight:600}
.chev{color:var(--tx-d);font-size:14px;transition:transform .18s;flex-shrink:0}
.cmd.open .chev{transform:rotate(180deg);color:var(--blue)}
.cmd-body{padding:15px 17px;display:none}

/* input N° comanda en el header (marcar como cargado) */
.cmd-mark{display:flex;align-items:center;gap:0;flex-shrink:0}
.cmd-comanda{width:120px;border:1px solid var(--brd2);border-right:none;border-radius:var(--rm) 0 0 var(--rm);padding:6px 9px;font-size:12px;font-family:var(--f);color:var(--tx);background:#fff;outline:none;transition:border-color .13s}
.cmd-comanda:focus{border-color:var(--green)}
.cmd-comanda::placeholder{color:var(--tx-d)}
.cmd-comanda.ready-glow{border-color:var(--green);animation:glowpulse 1.5s ease}
@keyframes glowpulse{0%{box-shadow:0 0 0 0 rgba(26,158,74,.45)}70%{box-shadow:0 0 0 5px rgba(26,158,74,0)}100%{box-shadow:0 0 0 0 rgba(26,158,74,0)}}
.cmd-ok{border:none;background:var(--green);color:#fff;border-radius:0 var(--rm) var(--rm) 0;padding:7px 11px;font-size:13px;cursor:pointer;transition:background .13s}
.cmd-ok:hover{background:#158640}
.cmd-ok:disabled{opacity:.5;cursor:default}

/* badge de comanda cargada */
.b-cargado{flex-shrink:0;font-size:12px;font-weight:800;padding:4px 10px;border-radius:var(--r);background:rgba(26,158,74,.1);color:var(--green);border:1px solid rgba(26,158,74,.28);display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,Menlo,Consolas,monospace}
.b-desp{flex-shrink:0;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:var(--r);background:var(--blue-a);color:var(--blue);border:1px solid rgba(0,163,224,.25)}
.b-falta{flex-shrink:0;font-size:10px;font-weight:800;padding:3px 9px;border-radius:var(--r);background:rgba(214,48,49,.1);color:var(--red);border:1px solid rgba(214,48,49,.3);display:inline-flex;align-items:center;gap:5px}
.cmd.is-cargado{opacity:.96}

/* control de carga por ítem (faltantes) */
.cargar-box.ctrl .cc-item{gap:10px}
.cc-ped{flex:0 0 auto;font-size:11px;color:var(--tx-m);white-space:nowrap}
.cc-in{flex:0 0 62px;width:62px;text-align:center;border:1px solid var(--brd2);border-radius:var(--r);padding:5px 6px;font-size:12px;font-weight:700;font-family:var(--f);color:var(--tx);background:#fff;outline:none;transition:border-color .13s}
.cc-in:focus{border-color:var(--blue)}
.cc-falta{flex:0 0 74px;text-align:right;font-size:11px;font-weight:700;color:var(--green)}
.cc-falta.on{color:var(--red)}
/* stepper +/- alrededor de la cantidad */
.cc-step{flex:0 0 auto;display:inline-flex;align-items:center}
.cc-step .cc-in{flex:0 0 46px;width:46px;border-radius:0;border-left:none;border-right:none}
.cc-step-b{width:24px;height:28px;border:1px solid var(--brd2);background:var(--surf);color:var(--tx-m);cursor:pointer;font-size:15px;font-weight:700;font-family:var(--f);line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:background .12s,color .12s,border-color .12s}
.cc-step-b:first-child{border-radius:var(--r) 0 0 var(--r)}
.cc-step-b:last-child{border-radius:0 var(--r) var(--r) 0}
.cc-step-b:hover{background:var(--blue-a);color:var(--blue-d);border-color:var(--blue)}
/* botón excluir (poné 0) */
.cc-excl{flex:0 0 auto;width:26px;height:26px;border:1px solid var(--brd);background:transparent;color:var(--tx-d);border-radius:var(--r);cursor:pointer;font-size:10px;display:inline-flex;align-items:center;justify-content:center;transition:all .12s}
.cc-excl:hover{border-color:var(--red);color:var(--red)}
.cc-item.excl{opacity:.6}
.cc-item.excl .cc-desc,.cc-item.excl .cc-sku{text-decoration:line-through}
.cc-item.excl .cc-excl{background:rgba(214,69,69,.1);border-color:var(--red);color:var(--red)}
.falta-aviso{background:rgba(214,48,49,.06);border:1px solid rgba(214,48,49,.28);border-left:3px solid var(--red);border-radius:0 var(--rm) var(--rm) 0;padding:10px 13px;font-size:12px;color:#a02;margin-bottom:13px}
.falta-aviso i{margin-right:6px}
.btn-markbody{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;margin-bottom:13px;background:var(--green);color:#fff;border:none;border-radius:var(--rm);font-size:13px;font-weight:700;cursor:pointer;transition:background .13s;box-shadow:0 2px 8px rgba(26,158,74,.22)}
.btn-markbody:hover{background:#158640}
.btn-markbody:disabled{background:var(--brd2);color:var(--tx-d);cursor:not-allowed;box-shadow:none}

/* notas del operador (aprobador / reseller) */
.notas-box{display:flex;flex-direction:column;gap:10px;margin-bottom:13px}
.nota-item label{display:block;font-size:11px;font-weight:700;color:var(--tx-m);margin-bottom:5px}
.nota-item label i{margin-right:5px;color:var(--blue)}
.nota-item textarea,.nota-edit textarea{width:100%;border:1px solid var(--brd);border-radius:var(--rm);padding:8px 11px;font-size:12.5px;font-family:var(--f);color:var(--tx);background:var(--surf);outline:none;resize:vertical;transition:border-color .13s}
.nota-item textarea:focus,.nota-edit textarea:focus{border-color:var(--blue);background:#fff}
.nota-edit{display:flex;gap:8px;align-items:flex-start}
.nota-edit textarea{flex:1}
.nota-save{flex:0 0 auto;background:var(--blue);color:#fff;border:none;border-radius:var(--rm);padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:background .13s}
.nota-save:hover{background:var(--blue-d)}
.nota-save:disabled{opacity:.5}
.nota-ro{font-size:12px;color:var(--tx);background:#fff6e6;border:1px solid #f3dca6;border-radius:var(--rm);padding:8px 12px}
.nota-lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#b57500;margin-bottom:3px}

/* detalle de comanda cargada (dentro del body) */
.carg-detail{background:rgba(26,158,74,.05);border:1px solid rgba(26,158,74,.2);border-radius:var(--rm);padding:11px 14px;margin-bottom:13px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.carg-detail .cd-num{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;color:var(--green);font-size:15px}
.carg-detail .cd-meta{font-size:11px;color:var(--tx-m)}
.carg-detail .cd-actions{margin-left:auto;display:flex;gap:8px}
.btn-undo{background:var(--surf);border:1px solid var(--brd);color:var(--tx-m);border-radius:var(--rm);padding:6px 11px;font-size:11px;font-weight:600;cursor:pointer;transition:all .13s}
.btn-undo:hover{border-color:var(--red);color:var(--red)}
.cd-pdf{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid rgba(214,48,49,.3);color:#c0392b;border-radius:var(--rm);padding:6px 11px;font-size:11px;font-weight:700;text-decoration:none;transition:all .13s}
.cd-pdf:hover{background:rgba(214,48,49,.06);border-color:var(--red)}

/* bloque de despacho (comanda despachada) */
.desp-box{border:1px solid rgba(0,163,224,.3);background:var(--blue-b);border-radius:var(--rm);padding:12px 14px;margin-bottom:13px}
.desp-row{display:flex;align-items:center;gap:12px;font-size:12.5px;padding:4px 0}
.desp-lbl{flex:0 0 110px;color:var(--tx-m);font-weight:600}
.desp-badge{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:var(--r);background:var(--blue-a);color:var(--blue);border:1px solid rgba(0,163,224,.3)}
.cd-guia{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--blue);text-decoration:none}
.cd-guia:hover{text-decoration:underline}
.desp-actions{display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,163,224,.15)}
.btn-mail{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border:none;border-radius:var(--rm);padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:background .13s;box-shadow:0 2px 8px rgba(0,163,224,.22)}
.btn-mail:hover{background:var(--blue-d)}
.btn-mail.sent{background:var(--surf);color:var(--blue);border:1px solid rgba(0,163,224,.4);box-shadow:none}
.btn-mail:disabled{background:var(--surf);color:var(--tx-d);border:1px solid var(--brd);box-shadow:none;cursor:not-allowed}
.mail-ok{font-size:11px;font-weight:700;color:var(--green)}
.desp-wait{background:rgba(212,137,10,.07);border:1px solid rgba(212,137,10,.28);border-left:3px solid var(--yellow);border-radius:0 var(--rm) var(--rm) 0;padding:10px 13px;font-size:12px;font-weight:600;color:#8a5a00;margin-bottom:13px;display:flex;align-items:center;gap:8px}
.cmd.open .cmd-body{display:block}

/* ficha */
.ficha{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rm);padding:2px 14px;margin-bottom:13px}
.ficha-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--brd);font-size:12px}
.ficha-row:last-child{border-bottom:none}
.ficha-lbl{color:var(--tx-m);flex-shrink:0}
.ficha-val{color:var(--tx);font-weight:600;text-align:right;word-break:break-word}

/* lineas SKU */
.lineas{border:1px solid var(--brd);border-radius:var(--rm);overflow:hidden;margin-bottom:13px}
.linea{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--brd);font-size:12px}
.linea:last-child{border-bottom:none}
.linea:nth-child(odd){background:var(--surf)}
.linea-sku{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--blue);flex:0 0 120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linea-cant{flex:0 0 46px;text-align:center;font-weight:700;color:var(--tx);background:var(--blue-a);border-radius:var(--r);padding:2px 0;font-size:11px}
.linea-desc{flex:1;color:var(--tx);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linea-split{flex:0 0 auto;font-size:9.5px;font-weight:700;color:var(--yellow);background:rgba(212,137,10,.1);border:1px solid rgba(212,137,10,.25);border-radius:var(--r);padding:2px 6px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.linea-tot{flex:0 0 auto;color:var(--tx-m);font-size:11px;text-align:right;white-space:nowrap}

/* rótulo de sección */
.sec-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx-d);margin:2px 0 7px}

/* detalle de facturación colapsable */
.pedido-det{margin-bottom:13px}
.pedido-det>summary{cursor:pointer;user-select:none;list-style:none;display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx-d);padding:4px 0}
.pedido-det>summary::-webkit-details-marker{display:none}
.pedido-det>summary::before{content:'\f105';font-family:'Font Awesome 6 Free';font-weight:900;transition:transform .15s;font-size:12px}
.pedido-det[open]>summary::before{transform:rotate(90deg)}
.pedido-det>summary:hover{color:var(--tx-m)}

/* panel "qué cargar en Masterchief" */
.cargar-box{border:1px solid rgba(0,163,224,.35);border-radius:var(--rm);background:var(--blue-b);margin-bottom:14px;overflow:hidden}
.cargar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;background:var(--blue-a);border-bottom:1px solid rgba(0,163,224,.25);font-size:12px;font-weight:700;color:var(--blue-d)}
.cargar-head i{margin-right:6px}
.cc-list{padding:5px 0}
.cc-item{display:flex;align-items:center;gap:10px;padding:6px 13px;font-size:12px}
.cc-item + .cc-item{border-top:1px solid rgba(0,163,224,.12)}
.cc-cant{flex:0 0 auto;min-width:34px;text-align:center;font-weight:800;color:var(--blue-d);background:#fff;border:1px solid rgba(0,163,224,.3);border-radius:var(--r);padding:1px 6px;font-size:11px}
.cc-sku{flex:0 0 130px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-desc{flex:1;color:var(--tx-m);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-flag{flex:0 0 auto;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx-m);background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:1px 6px}

/* totales */
.tot-row{display:flex;justify-content:flex-end;gap:18px;padding:4px 2px 2px;font-size:13px}
.tot-row b{color:var(--tx)}
.tot-usd{color:var(--green);font-weight:800}
.tot-ars{color:var(--tx-m);font-weight:700}

/* badges estado */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:var(--r);border:1px solid var(--brd);background:var(--surf);color:var(--tx-m);display:inline-flex;align-items:center;gap:5px}
.pill.ok{background:rgba(26,158,74,.09);color:var(--green);border-color:rgba(26,158,74,.25)}
.pill.warn{background:rgba(212,137,10,.09);color:var(--yellow);border-color:rgba(212,137,10,.25)}

/* aviso masterchief */
.aviso{background:rgba(255,171,0,.07);border:1px solid rgba(255,171,0,.35);border-left:3px solid var(--amber);border-radius:0 var(--rm) var(--rm) 0;padding:11px 14px;font-size:12.5px;font-weight:600;color:#8a5a00;display:flex;align-items:center;gap:9px}
.aviso i{font-size:15px}

/* comentarios */
.coment{margin-top:11px;font-size:12px;color:var(--tx-m);background:var(--surf);border:1px solid var(--brd);border-radius:var(--rm);padding:9px 12px;line-height:1.55}
.coment b{color:var(--tx);font-weight:700}

/* envíos */
.env-block{border:1px solid var(--brd);border-radius:var(--rm);padding:11px 13px;margin-bottom:12px;background:var(--surf)}
.env-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.env-n{font-size:12px;font-weight:800;color:var(--blue);background:var(--blue-a);border:1px solid rgba(0,163,224,.25);border-radius:var(--r);padding:2px 9px}
.env-com{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--tx);font-size:13px}
.env-fecha{font-size:11px;color:var(--tx-d)}
.env-wait{font-size:11px;font-weight:700;color:var(--yellow)}
.env-items{background:#fff;border:1px solid var(--brd);border-radius:var(--rm)}
.env-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.env-form{display:flex;flex-direction:column;gap:10px;padding:11px 13px;border-top:1px solid rgba(0,163,224,.18)}
.env-form .cmd-mark{width:100%}
.env-form .cmd-comanda{width:100%;border-radius:var(--rm);border:1px solid var(--brd2)}
.env-form .btn-crear{margin-bottom:0}

/* estados globales */
.state{text-align:center;padding:60px 20px;color:var(--tx-d)}
.state i{font-size:38px;margin-bottom:14px;display:block}
.state.empty i{color:var(--green)}
.state .st-title{font-size:15px;font-weight:700;color:var(--tx-m);margin-bottom:4px}
.state .st-sub{font-size:12px;color:var(--tx-d)}
.err-box{background:rgba(214,48,49,.06);border:1px solid rgba(214,48,49,.3);color:var(--red);border-radius:var(--rm);padding:14px 16px;font-size:13px;font-weight:600}
.spinner{width:30px;height:30px;border:3px solid var(--brd);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}

/* botones con spinner inline (anti doble-click) */
.btn-mail.loading,.btn-markbody.loading,.btn-out.loading{pointer-events:none;opacity:.75}
.btn-mail.loading i,.btn-markbody.loading i,.btn-out.loading i{animation:sp .8s linear infinite}
.btn-prev{background:var(--panel);border:1px solid rgba(0,163,224,.4);color:var(--blue);border-radius:var(--rm);padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:all .13s;display:inline-flex;align-items:center;gap:7px}
.btn-prev:hover{background:var(--blue-a)}

/* nota BigQuery (la guía tarda) */
.bq-note{font-size:11px;color:var(--tx-d);margin-top:6px;display:flex;align-items:center;gap:6px}
.bq-note i{color:var(--yellow)}

/* banner de error de mail (cola de reintentos) */
.mail-err{background:rgba(214,48,49,.07);border:1px solid rgba(214,48,49,.32);border-left:3px solid var(--red);border-radius:0 var(--rm) var(--rm) 0;padding:9px 12px;margin-top:8px;font-size:12px;color:#a02;display:flex;align-items:center;gap:8px;line-height:1.4}
.mail-err i{font-size:14px;flex-shrink:0}

/* envío listo para enviar (guía OK, mail sin mandar) */
.env-block.ready{border-color:rgba(26,158,74,.45);background:rgba(26,158,74,.04)}
.b-ready{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:var(--r);background:rgba(26,158,74,.12);color:var(--green);border:1px solid rgba(26,158,74,.35)}
.env-oper{font-size:10.5px;color:var(--tx-d);display:inline-flex;align-items:center;gap:5px}
.env-oper i{color:var(--tx-d)}
.btn-resend{background:var(--panel);border:1px solid var(--brd);color:var(--tx-m);border-radius:var(--rm);padding:8px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:all .13s;display:inline-flex;align-items:center;gap:6px}
.btn-resend:hover{border-color:var(--yellow);color:var(--yellow)}
.btn-resend.loading{pointer-events:none;opacity:.75}
.btn-resend.loading i{animation:sp .8s linear infinite}
/* nota de chequeo de PDF en el formulario de armar envío */
.dup-note{font-size:11px;margin-top:4px;display:none;align-items:center;gap:6px;color:#a86500;font-weight:600}
.dup-note.show{display:flex}
.crear-hint{font-size:11px;color:var(--tx-d);margin:0 0 7px;display:none}
.pdf-note{font-size:11px;margin-top:2px;display:none;align-items:center;gap:6px}
.pdf-note.show{display:flex;color:var(--tx-d)}
.pdf-note.warn{display:flex;color:#a86500}
.pdf-note.ok{display:flex;color:var(--green)}

/* item pendiente marcado ENTREGADO en la hoja (sync inverso) */
.cc-entr{flex:0 0 auto;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--green);background:rgba(26,158,74,.1);border:1px solid rgba(26,158,74,.3);border-radius:var(--r);padding:2px 7px;display:inline-flex;align-items:center;gap:4px}
.cc-item.is-entr{background:rgba(26,158,74,.04)}
.pill.entr{background:rgba(26,158,74,.09);color:var(--green);border-color:rgba(26,158,74,.28)}

/* modal vista previa */
.pv-overlay{position:fixed;inset:0;background:rgba(10,15,25,.55);backdrop-filter:blur(2px);z-index:1000;display:none;align-items:center;justify-content:center;padding:22px}
.pv-overlay.show{display:flex}
.pv-modal{background:var(--panel);border-radius:var(--rl);width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.35);overflow:hidden}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--brd)}
.pv-title{font-size:14px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:9px}
.pv-title i{color:var(--blue)}
.pv-x{background:transparent;border:none;color:var(--tx-d);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:var(--r);transition:all .13s}
.pv-x:hover{background:var(--surf);color:var(--red)}
.pv-meta{padding:11px 18px;font-size:12px;color:var(--tx-m);background:var(--surf);border-bottom:1px solid var(--brd);line-height:1.7}
.pv-meta b{color:var(--tx)}
.pv-meta .pv-warn{color:var(--red);font-weight:700}
.pv-body{flex:1;overflow:auto;background:#f4f6f8;padding:0}
.pv-body iframe{width:100%;height:52vh;border:none;background:#fff;display:block}
.pv-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-top:1px solid var(--brd)}
.pv-foot .btn-mail:disabled{background:var(--surf);color:var(--tx-d);border:1px solid var(--brd);box-shadow:none;cursor:not-allowed}

/* reporte de tiempos */
.rep-sub{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx-d);margin:2px 0 9px}
.rep-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.rep-card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rm);padding:12px 10px;text-align:center}
.rep-card .rc-n{font-size:22px;font-weight:800;color:var(--blue);line-height:1.1}
.rep-card .rc-l{font-size:10.5px;color:var(--tx-m);margin-top:3px}
.rep-card.big .rc-n{color:var(--green)}
.rep-note{font-size:11.5px;color:var(--tx-m);background:var(--surf);border:1px solid var(--brd);border-radius:var(--rm);padding:9px 12px;line-height:1.5}
.rep-note b{color:var(--tx)}
.rep-warn{color:#a86500}
@media(max-width:560px){.rep-cards{grid-template-columns:repeat(2,1fr)}}

/* cuello de botella: dónde está la demora */
.bn-box{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rm);padding:14px 16px;margin-bottom:18px}
.bn-head{font-size:13px;font-weight:800;color:var(--tx);margin-bottom:10px}
.bn-callout{background:rgba(214,48,49,.08);border:1px solid rgba(214,48,49,.28);border-left:3px solid var(--red);border-radius:0 var(--rm) var(--rm) 0;padding:9px 12px;font-size:12.5px;color:var(--tx);margin-bottom:14px;line-height:1.5}
.bn-callout b{color:var(--red)}
.bn-row{display:grid;grid-template-columns:130px 1fr 110px;align-items:center;gap:10px;margin-bottom:9px}
.bn-lbl{font-size:12px;font-weight:700;color:var(--tx-m);white-space:nowrap}
.bn-bar-wrap{background:var(--bg);border:1px solid var(--brd);border-radius:6px;height:20px;overflow:hidden}
.bn-bar{height:100%;background:var(--blue);border-radius:6px 0 0 6px;transition:width .4s ease;min-width:4px}
.bn-bar.bn-worst{background:var(--red)}
.bn-val{font-size:12px;font-weight:700;color:var(--tx);text-align:right;white-space:nowrap}
.bn-val .bn-pct{font-weight:600;color:var(--tx-d);font-size:11px}
.bn-note{font-size:11px;color:var(--tx-d);padding-left:6px}
@media(max-width:560px){.bn-row{grid-template-columns:100px 1fr 85px;gap:6px}}

/* top comandas más lentas */
.pt-box{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rm);padding:14px 16px;margin-bottom:18px}
.pt-scroll{overflow-x:auto}
.pt-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.pt-table th{text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--tx-d);padding:6px 8px;border-bottom:1px solid var(--brd);white-space:nowrap}
.pt-td{padding:7px 8px;border-bottom:1px solid var(--brd);white-space:nowrap;color:var(--tx-m)}
.pt-comanda{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;color:var(--tx)}
.pt-reseller{color:var(--tx);font-weight:600}
.pt-sub{font-size:10px;color:var(--tx-d);font-weight:600;margin-top:1px}
.pt-max{color:var(--red);font-weight:800}
.pt-total{font-weight:800;color:var(--tx)}
.pt-na{color:var(--tx-d)}

/* tendencia semana a semana */
.tr-box{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rm);padding:14px 16px;margin-bottom:18px}
.tr-legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px}
.tr-leg-item{font-size:11.5px;color:var(--tx-m);display:flex;align-items:center;gap:6px}
.tr-leg-item b{color:var(--tx);font-weight:700}
.tr-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.tr-mejor{color:var(--green);font-weight:700}
.tr-peor{color:var(--red);font-weight:700}
.tr-nd{color:var(--tx-d)}
.tr-svg{width:100%;height:auto;display:block;margin-top:4px}

/* centro de comando de tiempos (vista propia, no modal) */
.cc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.cc-title{font-size:19px;font-weight:800;color:var(--tx);display:flex;align-items:center;gap:9px}
.cc-title i{color:var(--blue)}
.cc-desde{font-size:12px;color:var(--tx-m);margin-top:4px}
.cc-desde b{color:var(--tx)}
.cc-actions{display:flex;gap:8px;flex-wrap:wrap}
.cc-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.cc-kpi{background:var(--panel);border:1px solid var(--brd);border-radius:var(--rm);padding:14px 12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cc-kpi .cc-kpi-n{font-size:24px;font-weight:800;color:var(--blue);line-height:1.1}
.cc-kpi.cc-kpi-hi .cc-kpi-n{color:var(--green)}
.cc-kpi.cc-kpi-warn .cc-kpi-n{color:var(--red)}
.cc-kpi .cc-kpi-l{font-size:10.5px;color:var(--tx-m);margin-top:4px;font-weight:600}
.cc-grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:stretch}
.cc-grid2 .tr-box,.cc-grid2 .bn-box{margin-bottom:0;height:100%}
.cc-empty{background:var(--panel);border:1px solid var(--brd);border-radius:var(--rl);padding:50px 30px;text-align:center;color:var(--tx-m)}
.cc-empty i{font-size:28px;color:var(--tx-d);margin-bottom:10px;display:block}
@media(max-width:900px){
  .cc-kpis{grid-template-columns:repeat(2,1fr)}
  .cc-grid2{grid-template-columns:1fr}
}

/* ── barra fija (sticky) ── */
.stickyhead{position:sticky;top:56px;z-index:150;background:var(--bg);padding-top:4px}

/* ── menú Herramientas ── */
.tools-wrap{position:relative}
.tools-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--brd);border-radius:var(--rm);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:210px;z-index:310;display:none;flex-direction:column;gap:2px}
.tools-menu.show{display:flex}
.tools-menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:none;color:var(--tx);font-size:12.5px;font-weight:600;padding:9px 11px;border-radius:var(--r);cursor:pointer;font-family:var(--f)}
.tools-menu button:hover{background:var(--surf)}
.tools-menu button i{color:var(--tx-m);width:16px;text-align:center}
.tools-sep{height:1px;background:var(--brd);margin:4px 0}

/* ── barra de progreso por venta ── */
.prog{flex:0 0 96px;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.prog-bar{width:96px;height:6px;border-radius:3px;background:var(--raise);overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.prog-fill.zero{background:var(--brd2)}
.prog-fill.part{background:var(--yellow)}
.prog-lbl{font-size:9.5px;font-weight:700;color:var(--tx-m);font-variant-numeric:tabular-nums}

/* ── highlight de envío recién listo ── */
@keyframes flashReady{0%{background:rgba(26,158,74,.22)}100%{background:rgba(26,158,74,.04)}}
.env-block.just-ready{animation:flashReady 2.2s ease-out}

/* ── modal de confirmación ── */
.cf-modal{max-width:440px}
.cf-body{padding:18px;font-size:13.5px;color:var(--tx);line-height:1.55;white-space:pre-wrap}
#cf-ico{color:var(--yellow)}
.cf-overlay-danger #cf-ico{color:var(--red)}
.cf-modal .btn-mail.danger{background:var(--red)}
.cf-modal .btn-mail.danger:hover{background:#b3282b}

/* ── modo oscuro ── */
body.dark{
  --blue-a:rgba(0,163,224,.18); --blue-b:rgba(0,163,224,.08);
  --bg:#12151c; --panel:#1b1f28; --surf:#232833; --raise:#2b313d; --hov:#323844;
  --brd:#2e343f; --brd2:#404857; --tx:#e6e9ee; --tx-m:#9aa4b2; --tx-d:#6b7482;
}
body.dark .cmd,body.dark .hero,body.dark .site-header{box-shadow:0 1px 4px rgba(0,0,0,.4)}
body.dark .pv-body{background:#0e1117}
body.dark .env-com,body.dark .cd-num{color:var(--tx)}

/* ── responsive / mobile ── */
@media(max-width:640px){
  .site-header{padding:10px 14px}
  .header-sub{display:none}
  .wrap{padding:14px 10px 50px}
  .stickyhead{top:50px}
  .viewtabs{overflow-x:auto}
  .vtab{flex:0 0 auto;padding:9px 10px;font-size:12px}
  .vtab i{display:none}
  .toolbar .btn-out{padding:9px 11px}
  .prog{flex-basis:70px}.prog-bar{width:70px}
  .pv-overlay{padding:0}
  .pv-modal{max-width:100%;max-height:100vh;height:100vh;border-radius:0}
  .pv-body iframe{height:auto;flex:1}
  .desp-lbl{flex-basis:90px}
  .linea-sku,.cc-sku{flex-basis:96px}
}

/* ── qué cargar: tocá el SKU para copiarlo y marcarlo como cargado en Masterchief ── */
.cc-sku.cc-copy{cursor:pointer;overflow:visible;border-radius:var(--r);padding:1px 6px;margin:-1px 0;transition:background .12s,opacity .12s;user-select:none;display:inline-flex;align-items:center;gap:6px}
.cc-sku.cc-copy:hover{background:var(--blue-a);color:var(--blue-d)}
.cc-sku.cc-copy.done{text-decoration:line-through;color:var(--tx-d);opacity:.7}
.cc-done-mark{color:var(--green);font-size:11px;opacity:0;transition:opacity .12s}
.cc-sku.cc-copy.done .cc-done-mark{opacity:1}
.cc-copy-hint{color:var(--tx-d);font-size:10px;opacity:0;transition:opacity .12s}
.cc-sku.cc-copy:hover .cc-copy-hint{opacity:.7}
.cc-sku.cc-copy.done .cc-copy-hint{display:none}
.carg-count{font-size:11px;font-weight:600;color:var(--green)}
.carg-reset{background:transparent;border:none;color:var(--tx-d);font-size:11px;cursor:pointer;text-decoration:underline;padding:0 2px;font-family:var(--f)}
.carg-reset:hover{color:var(--red)}

/* ── copiar al portapapeles ── */
.copy-ic{background:transparent;border:none;color:var(--tx-d);cursor:pointer;padding:2px 5px;border-radius:var(--r);font-size:11px;transition:all .12s;line-height:1;vertical-align:middle}
.copy-ic:hover{background:var(--surf);color:var(--blue)}
.copy-ic.ok{color:var(--green)}

/* ── botón ayuda + modal ayuda ── */
.help-btn{background:transparent;border:1px solid var(--brd);color:var(--tx-m);width:30px;height:30px;border-radius:var(--r);cursor:pointer;font-size:13px;transition:all .13s}
.help-btn:hover{border-color:var(--blue);color:var(--blue)}
.ayuda-sec{margin-bottom:18px}
.ayuda-sec h4{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--tx-d);margin:0 0 8px}
.ayuda-row{display:flex;gap:10px;align-items:baseline;font-size:12.5px;color:var(--tx);padding:5px 0;line-height:1.5}
.ayuda-row .k{flex:0 0 128px}
kbd{background:var(--surf);border:1px solid var(--brd2);border-bottom-width:2px;border-radius:4px;padding:1px 7px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:700;color:var(--tx)}
.ayuda-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:var(--r);white-space:nowrap}
.header-right{display:flex;align-items:center;gap:10px}

/* ── botón enviar todos los listos ── */
#btn-send-ready{background:var(--green);color:#fff;border-color:var(--green)}
#btn-send-ready:hover{background:#158640}
#btn-send-ready.loading{pointer-events:none;opacity:.8}
#btn-send-ready.loading i{animation:sp .8s linear infinite}

/* ── ventana de carga inicial (splash a pantalla completa) ── */
.load-overlay{position:fixed;inset:0;z-index:1200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;transition:opacity .35s ease}
.load-overlay.hide{opacity:0;pointer-events:none}
.load-overlay .lo-mark{width:54px;height:54px;background:var(--blue);border-radius:var(--rm);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(0,163,224,.32);margin-bottom:4px}
.load-overlay .lo-mark span{color:#fff;font-size:15px;font-weight:700;letter-spacing:.05em}
.load-overlay .lo-spin{width:32px;height:32px;border:3px solid var(--brd);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
.load-overlay .lo-txt{font-size:13.5px;font-weight:700;color:var(--tx)}
.load-overlay .lo-sub{font-size:11.5px;color:var(--tx-d)}
</style>
</head>
<body>

<!-- ventana de carga inicial: cubre el arranque mientras se leen ventas/envíos/guías.
     Se oculta al terminar la 1ª carga (éxito o error) y no reaparece en los auto-refresh. -->
<div id="load-overlay" class="load-overlay">
  <div class="lo-mark"><span>DJI</span></div>
  <div class="lo-spin"></div>
  <div class="lo-txt">Cargando comandas…</div>
  <div class="lo-sub">Leyendo ventas, envíos y guías de despacho</div>
</div>

<header class="site-header">
  <div class="header-brand">
    <div class="dji-mark"><span>DJI</span></div>
    <div>
      <div class="header-name">Comandas · Carga Masterchief</div>
      <div class="header-sub">BIDCOMAGRO · Ventas pendientes de carga</div>
    </div>
  </div>
  <div class="header-right">
    <button class="help-btn" onclick="openAyuda()" title="Ayuda: leyenda + atajos"><i class="fa-solid fa-question"></i></button>
    <div class="header-badge">Interno</div>
  </div>
</header>

<div class="wrap">

  <!-- resumen -->
  <div id="hero" class="hero" style="display:none">
    <div class="hero-ico"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="hero-txt">
      <div class="hero-count" id="hero-count">—</div>
      <div class="hero-sub" id="hero-sub"></div>
    </div>
  </div>

  <!-- barra fija: solapas + toolbar + filtros -->
  <div class="stickyhead" id="stickyhead">

  <!-- vistas -->
  <div class="viewtabs" id="viewtabs" style="display:none">
    <button class="vtab active" id="vtab-pend" onclick="switchView('pend')">
      <i class="fa-solid fa-truck-ramp-box"></i> Pendientes <span class="vcount" id="cnt-pend">0</span>
    </button>
    <button class="vtab" id="vtab-parcial" onclick="switchView('parcial')">
      <i class="fa-solid fa-triangle-exclamation"></i> Con faltantes <span class="vcount" id="cnt-parcial">0</span>
    </button>
    <button class="vtab" id="vtab-completo" onclick="switchView('completo')">
      <i class="fa-solid fa-circle-check"></i> Completadas <span class="vcount" id="cnt-completo">0</span>
    </button>
    <button class="vtab" id="vtab-envios" onclick="switchView('envios')">
      <i class="fa-solid fa-paper-plane"></i> Envíos <span class="vcount" id="cnt-envios">0</span>
    </button>
    <button class="vtab" id="vtab-tiempos" onclick="switchView('tiempos')">
      <i class="fa-solid fa-gauge-high"></i> Tiempos
    </button>
  </div>

  <!-- toolbar -->
  <div class="toolbar" id="toolbar" style="display:none">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="q" type="text" placeholder="Buscar…  (tecla /)" oninput="render()">
    </div>
    <button class="btn-out" id="btn-toggle-all" onclick="toggleTodo()"><i class="fa-solid fa-angles-down"></i> Expandir todo</button>
    <button class="btn-out" id="btn-send-ready" onclick="enviarTodosListos()" style="display:none" title="Enviar el mail de despacho de todos los envíos que ya tienen guía"><i class="fa-solid fa-paper-plane"></i> Enviar listos</button>
    <button class="btn-out" id="btn-sinmail" onclick="verSinMail()" style="display:none;border-color:rgba(212,137,10,.45);color:var(--yellow)" title="Resellers sin mail cargado (sus avisos quedarían sin destinatario)"><i class="fa-solid fa-user-slash"></i> sin mail</button>
    <button class="btn-out" id="btn-retry-all" onclick="reintentarFallidos()" style="display:none;border-color:rgba(214,48,49,.4);color:var(--red)" title="Reintentar los mails que fallaron"><i class="fa-solid fa-rotate-right"></i> Reintentar fallidos</button>
    <div class="tools-wrap">
      <button class="btn-out" id="btn-tools" onclick="toggleTools(event)"><i class="fa-solid fa-ellipsis"></i> Herramientas</button>
      <div class="tools-menu" id="tools-menu">
        <button onclick="closeTools();exportarFaltantes()"><i class="fa-solid fa-file-csv"></i> CSV Faltantes</button>
        <button onclick="closeTools();exportarEnvios()"><i class="fa-solid fa-file-csv"></i> CSV Envíos</button>
        <div class="tools-sep"></div>
        <button onclick="closeTools();toggleTema()"><i class="fa-solid fa-moon" id="tema-ico"></i> <span id="tema-lbl">Modo oscuro</span></button>
      </div>
    </div>
    <button class="btn-out" id="btn-refresh" onclick="cargar()" title="Actualizar (tecla r)"><i class="fa-solid fa-rotate"></i> Actualizar</button>
    <span class="ts-lbl" id="ts"></span>
  </div>

  <!-- filtros rápidos -->
  <div class="filters" id="filters" style="display:none">
    <span class="filters-lbl"><i class="fa-solid fa-filter"></i></span>
    <button class="fchip" id="fchip-sla" onclick="toggleFiltro('sla',this)"><i class="fa-solid fa-fire"></i> SLA vencido</button>
    <button class="fchip" id="fchip-listos" onclick="toggleFiltro('listos',this)"><i class="fa-solid fa-paper-plane"></i> Listos para enviar</button>
    <button class="fchip" id="fchip-error" onclick="toggleFiltro('error',this)"><i class="fa-solid fa-circle-exclamation"></i> Con error de mail</button>
    <select class="fsel" id="fsel-reseller" onchange="setFiltroReseller(this.value)"><option value="">Todos los resellers</option></select>
    <button class="fchip clear" id="fchip-clear" onclick="limpiarFiltros()" style="display:none"><i class="fa-solid fa-xmark"></i> Limpiar</button>
  </div>

  </div><!-- /stickyhead -->

  <!-- contenido -->
  <div id="content">
    <div class="state"><div class="spinner"></div><div class="st-sub">Cargando ventas…</div></div>
  </div>

</div>

<!-- modal vista previa del mail -->
<div id="pv-overlay" class="pv-overlay" onclick="if(event.target===this)cerrarPreview()">
  <div class="pv-modal">
    <div class="pv-head">
      <div class="pv-title"><i class="fa-solid fa-envelope-open-text"></i> Vista previa del mail al reseller</div>
      <button class="pv-x" onclick="cerrarPreview()" title="Cerrar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="pv-meta" id="pv-meta"></div>
    <div class="pv-body"><iframe id="pv-frame" title="Vista previa"></iframe></div>
    <div class="pv-foot">
      <button class="btn-out" onclick="cerrarPreview()"><i class="fa-solid fa-arrow-left"></i> Cerrar</button>
      <button class="btn-mail" id="pv-send"><i class="fa-solid fa-paper-plane"></i> Enviar ahora</button>
    </div>
  </div>
</div>

<!-- modal resellers sin mail -->
<div id="sm-overlay" class="pv-overlay" onclick="if(event.target===this)cerrarSinMail()">
  <div class="pv-modal">
    <div class="pv-head">
      <div class="pv-title"><i class="fa-solid fa-user-slash"></i> Resellers sin mail</div>
      <button class="pv-x" onclick="cerrarSinMail()" title="Cerrar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="pv-body" id="sm-body" style="padding:18px"></div>
    <div class="pv-foot">
      <button class="btn-out" onclick="cerrarSinMail()"><i class="fa-solid fa-arrow-left"></i> Cerrar</button>
    </div>
  </div>
</div>

<!-- modal de ayuda (leyenda + atajos) -->
<div id="ay-overlay" class="pv-overlay" onclick="if(event.target===this)cerrarAyuda()">
  <div class="pv-modal">
    <div class="pv-head">
      <div class="pv-title"><i class="fa-solid fa-circle-info"></i> Ayuda</div>
      <button class="pv-x" onclick="cerrarAyuda()" title="Cerrar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="pv-body" id="ay-body" style="padding:18px"></div>
    <div class="pv-foot"><button class="btn-out" onclick="cerrarAyuda()"><i class="fa-solid fa-arrow-left"></i> Cerrar</button></div>
  </div>
</div>

<!-- modal de confirmación (reemplaza confirm() nativo) -->
<div id="cf-overlay" class="pv-overlay" onclick="if(event.target===this)cfResolver(false)">
  <div class="pv-modal cf-modal">
    <div class="pv-head"><div class="pv-title"><i class="fa-solid fa-circle-question" id="cf-ico"></i> <span id="cf-title">Confirmar</span></div></div>
    <div class="cf-body" id="cf-msg"></div>
    <div class="pv-foot">
      <button class="btn-out" id="cf-no" onclick="cfResolver(false)">Cancelar</button>
      <button class="btn-mail" id="cf-yes" onclick="cfResolver(true)">Confirmar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
var _data = [];       // comandas crudas del server
var _view = 'pend';   // 'pend' | 'parcial' | 'completo' | 'envios' | 'tiempos'
var _tiemposData = null;      // cache de CP_reporteTiempos() — se pisa solo con "Actualizar" (vista propia, no depende del refresh de comandas)
var _tiemposCargando = false;
var _prevReady = null; // set de envíos "listos" del refresh anterior (para avisar los nuevos)
var _nuevosReady = {};  // envíos que recién pasaron a "listo" (para el highlight)
var _cargadosMc = {};   // 'idVenta##sku' -> true: filas marcadas "ya cargadas en Masterchief" (por sesión)
var _filtros = { sla:false, listos:false, error:false, reseller:'' };

var _cargando = false;
var _keepScroll = false;   // preservar la posición de scroll en el próximo render (refresh)

// Oculta la ventana de carga inicial una sola vez, al terminar la 1ª carga (éxito o error).
// No reaparece en los auto-refresh: sólo se oculta, nunca se re-muestra.
function _ocultarVentanaCarga(){
  var lo = document.getElementById('load-overlay');
  if (!lo || lo.classList.contains('hide')) return;
  lo.classList.add('hide');
  setTimeout(function(){ if (lo && lo.parentNode) lo.parentNode.removeChild(lo); }, 400);
}

function cargar(auto) {
  if (_cargando) return;
  _cargando = true;
  var btn = document.getElementById('btn-refresh');
  if (btn) btn.classList.add('spin');
  google.script.run
    .withSuccessHandler(function(res){
      _cargando = false;
      if (btn) btn.classList.remove('spin');
      _ocultarVentanaCarga();
      if (!res || !res.ok) { if (!auto) mostrarError((res && res.error) || 'No se pudo leer la hoja.'); return; }
      _data = res.comandas || [];
      if (res.sla){ AGING.warn = (res.sla.warn||4)*60; AGING.danger = (res.sla.danger||24)*60; }
      // aviso + highlight de guías nuevas: envíos que recién pasaron a "listo para enviar"
      var nuevoReady = readyKeys();
      _nuevosReady = {};
      if (_prevReady) Object.keys(nuevoReady).forEach(function(k){ if (!_prevReady[k]) _nuevosReady[k] = true; });
      var cantNuevos = Object.keys(_nuevosReady).length;
      if (auto && cantNuevos > 0) toast(cantNuevos+' envío'+(cantNuevos===1?'':'s')+' nuevo'+(cantNuevos===1?'':'s')+' listo'+(cantNuevos===1?'':'s')+' para enviar', 'ok', '📦');
      _prevReady = nuevoReady;
      document.getElementById('ts').textContent = 'Actualizado ' + (res.ts || '');
      document.getElementById('viewtabs').style.display = 'flex';
      poblarFiltroResellers();
      pintarHero(res.ventas || 0, res.items || 0, res.parcialCount || 0);
      _actualizarVisibilidadToolbar();   // pisa lo de pintarHero si la vista activa es "tiempos"
      _keepScroll = true;   // un refresh no debe hacer saltar la vista
      render();
    })
    .withFailureHandler(function(e){
      _cargando = false;
      if (btn) btn.classList.remove('spin');
      _ocultarVentanaCarga();
      if (!auto) mostrarError((e && e.message) || 'Error de conexión con el servidor.');
    })
    .CP_getComandas();
}
// ¿conviene auto-refrescar ahora? No si el operador está escribiendo o hay un modal abierto.
function _puedeAutoRefresh(){
  if (_cargando) return false;
  var ov = document.getElementById('pv-overlay');
  if (ov && ov.classList.contains('show')) return false;
  var ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return false;
  return true;
}

function pintarHero(ventas, items, parcial){
  parcial = parcial || 0;
  var hero = document.getElementById('hero');
  hero.style.display = 'flex';
  var ico = hero.querySelector('.hero-ico');
  var cnt = document.getElementById('hero-count'), sub = document.getElementById('hero-sub');
  // más antigua con trabajo pendiente (pendiente O parcial)
  var oldest = null;
  (_data||[]).forEach(function(c){
    if ((c.estadoEnvio === 'pendiente' || c.estadoEnvio === 'parcial') && c.cargadoTs && (!oldest || c.cargadoTs < oldest)) oldest = c.cargadoTs;
  });
  var extraViejo = oldest ? ' · más antigua: hace ' + agingStr(oldest) : '';

  if (ventas === 0 && parcial === 0){
    hero.classList.add('ok');
    ico.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
    cnt.innerHTML = 'Todo al día';
    sub.textContent = 'No hay ventas para cargar ni faltantes por enviar.';
  } else if (ventas > 0){
    hero.classList.remove('ok');
    ico.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
    cnt.innerHTML = ventas + ' <small>venta' + (ventas===1?'':'s') + ' para cargar en Masterchief' + (parcial ? ' · ' + parcial + ' con faltantes' : '') + '</small>';
    sub.textContent = items + ' ítem' + (items===1?'':'s') + ' en total' + extraViejo + '.';
  } else {
    // ventas === 0 pero hay parciales con faltantes por enviar
    hero.classList.remove('ok');
    ico.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
    cnt.innerHTML = parcial + ' <small>venta' + (parcial===1?'':'s') + ' con faltantes por enviar</small>';
    sub.textContent = 'No quedan ventas nuevas para cargar' + extraViejo + '.';
  }
}

function switchView(v){
  _view = v;
  ['pend','parcial','completo','envios','tiempos'].forEach(function(x){
    var b = document.getElementById('vtab-'+x); if (b) b.classList.toggle('active', v===x);
  });
  _actualizarVisibilidadToolbar();
  render();
}
// Tiempos es una vista propia (centro de comando), no una lista de comandas: no necesita
// buscador/filtros/toolbar de acciones sobre ventas, y usa el ancho completo del wrap.
function _actualizarVisibilidadToolbar(){
  var esTiempos = (_view === 'tiempos');
  var toolbar = document.getElementById('toolbar'), filters = document.getElementById('filters'), hero = document.getElementById('hero');
  if (toolbar) toolbar.style.display = esTiempos ? 'none' : 'flex';
  if (filters) filters.style.display = esTiempos ? 'none' : 'flex';
  if (hero)    hero.style.display    = esTiempos ? 'none' : 'flex';
  var wrap = document.querySelector('.wrap'); if (wrap) wrap.classList.toggle('wrap-wide', esTiempos);
}

function _matchVenta(c, q){
  if (!q) return true;
  var comandas = (c.envios||[]).map(function(e){ return e.comanda; }).join(' ');
  var hay = [c.idVenta, c.reseller, c.razonSocial, c.operacion, comandas].join(' ').toLowerCase();
  if (hay.indexOf(q) > -1) return true;
  return (c.lineas||[]).some(function(l){ return (l.sku+' '+l.descripcion).toLowerCase().indexOf(q) > -1; });
}

function render(){
  if (_view === 'tiempos'){ renderTiempos(document.getElementById('content')); return; }
  var q = (document.getElementById('q').value || '').trim().toLowerCase();
  var filtered = _data.filter(function(c){ return _matchVenta(c, q) && _pasaFiltros(c); });
  var pend     = filtered.filter(function(c){ return c.estadoEnvio === 'pendiente'; });
  var parcial  = filtered.filter(function(c){ return c.estadoEnvio === 'parcial'; });
  var completo = filtered.filter(function(c){ return c.estadoEnvio === 'completo'; });

  // envíos aplanados (para la solapa Envíos) — respetando filtros por envío
  var envios = [];
  filtered.forEach(function(c){ (c.envios||[]).forEach(function(e){
    if (_filtros.listos && !esReady(c, e)) return;
    if (_filtros.error  && !e.mailError)   return;
    envios.push({ c: c, e: e });
  }); });

  document.getElementById('cnt-pend').textContent     = pend.length;
  document.getElementById('cnt-parcial').textContent  = parcial.length;
  document.getElementById('cnt-completo').textContent = completo.length;
  document.getElementById('cnt-envios').textContent   = envios.length;

  var cont = document.getElementById('content');
  var vacio, html;
  if (_view === 'envios'){
    // listos para enviar (guía OK, mail sin mandar) primero; luego por fecha desc
    envios.sort(function(a,b){
      var ra = esReady(a.c,a.e)?1:0, rb = esReady(b.c,b.e)?1:0;
      if (ra !== rb) return rb - ra;
      return (b.e.fechaTs||0) - (a.e.fechaTs||0);
    });
    if (!envios.length){
      html = _estado(q, 'fa-paper-plane', 'Sin envíos', 'Todavía no se creó ningún envío.');
    } else {
      html = envios.map(function(x){ return envioCardHTML(x.c, x.e); }).join('');
    }
  } else {
    var list, ic, tt, ss;
    if (_view === 'pend'){ list = pend.sort(function(a,b){ return (a.cargadoTs||Infinity)-(b.cargadoTs||Infinity); }); ic='fa-circle-check'; tt='Nada pendiente'; ss='No hay ventas sin envíos.'; }
    else if (_view === 'parcial'){ list = parcial.sort(function(a,b){ return (a.cargadoTs||Infinity)-(b.cargadoTs||Infinity); }); ic='fa-circle-check'; tt='Sin faltantes'; ss='No hay ventas con envíos parciales.'; }
    else { list = completo.sort(function(a,b){ return _ultTs(b)-_ultTs(a); }); ic='fa-box-open'; tt='Sin completadas'; ss='Cuando una venta se envíe entera va a aparecer acá.'; }
    if (!list.length){ html = _estado(q, ic, tt, ss); }
    else { html = list.map(cardHTML).join(''); }
  }
  var _sy = _keepScroll ? window.scrollY : null;
  cont.innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('.cargar-box.ctrl .cc-in'), function(inp){ ccMark(inp); });
  restaurarAbiertas();
  restaurarCargados();
  sincToggleBtn();
  tickAging();
  sincRetryBtn();
  sincReadyBtn();
  sincSinMailBtn();
  guardarPrefs();
  if (_sy != null) window.scrollTo(0, _sy);   // preservar la vista tras un refresh
  _keepScroll = false;
}
// ¿el envío está listo para mandar el mail al reseller? (DESPACHADO en Comandas Master, sin mandar, con destinatario)
function esReady(c, e){ return !!(e.despachado && !e.mailReseller && c.tieneDestino); }

// set { 'idVenta#envio': true } de los envíos listos para enviar (para avisar los nuevos)
function readyKeys(){
  var s = {};
  (_data||[]).forEach(function(c){ (c.envios||[]).forEach(function(e){ if (esReady(c,e)) s[c.idVenta+'#'+e.envio] = true; }); });
  return s;
}

// ── FILTROS RÁPIDOS ──
function _cVencido(c){
  if (!c.cargadoTs || c.estadoEnvio === 'completo') return false;
  return (Date.now() - c.cargadoTs)/60000 >= AGING.danger;   // pasó el umbral rojo
}
function _cTieneReady(c){ return (c.envios||[]).some(function(e){ return esReady(c,e); }); }
function _cTieneError(c){ return (c.envios||[]).some(function(e){ return !!e.mailError; }); }
function _pasaFiltros(c){
  if (_filtros.reseller && c.reseller !== _filtros.reseller) return false;
  if (_filtros.sla    && !_cVencido(c))   return false;
  if (_filtros.listos && !_cTieneReady(c)) return false;
  if (_filtros.error  && !_cTieneError(c)) return false;
  return true;
}
function toggleFiltro(k, btn){ _filtros[k] = !_filtros[k]; btn.classList.toggle('on', _filtros[k]); actualizarClear(); render(); }
function setFiltroReseller(v){ _filtros.reseller = v; actualizarClear(); render(); }
function limpiarFiltros(){
  _filtros = { sla:false, listos:false, error:false, reseller:'' };
  ['sla','listos','error'].forEach(function(k){ var b = document.getElementById('fchip-'+k); if (b) b.classList.remove('on'); });
  var sel = document.getElementById('fsel-reseller'); if (sel) sel.value = '';
  actualizarClear(); render();
}
function actualizarClear(){
  var any = _filtros.sla || _filtros.listos || _filtros.error || _filtros.reseller;
  var b = document.getElementById('fchip-clear'); if (b) b.style.display = any ? 'inline-flex' : 'none';
}
function poblarFiltroResellers(){
  var sel = document.getElementById('fsel-reseller'); if (!sel) return;
  var actual = sel.value || _filtros.reseller, set = {};
  (_data||[]).forEach(function(c){ if (c.reseller) set[c.reseller] = true; });
  var nombres = Object.keys(set).sort(function(a,b){ return a.localeCompare(b); });
  sel.innerHTML = '<option value="">Todos los resellers</option>' + nombres.map(function(n){ return '<option value="'+esc(n)+'">'+esc(n)+'</option>'; }).join('');
  if (actual && set[actual]) sel.value = actual;
}

// ── RESELLERS SIN MAIL (destinatario vacío) ──
function sinMailList(){
  var m = {};
  (_data||[]).forEach(function(c){
    if (c.tieneDestino) return;
    var r = c.reseller || '(sin reseller)';
    if (!m[r]) m[r] = { reseller: r, ventas: [] };
    m[r].ventas.push(c.idVenta);
  });
  return Object.keys(m).map(function(k){ return m[k]; });
}
function sincSinMailBtn(){
  var n = sinMailList().length, btn = document.getElementById('btn-sinmail');
  if (!btn) return;
  if (n > 0){ btn.style.display = 'inline-flex'; btn.innerHTML = '<i class="fa-solid fa-user-slash"></i> '+n+' sin mail'; }
  else btn.style.display = 'none';
}
function verSinMail(){
  var lista = sinMailList(), body = document.getElementById('sm-body');
  if (!lista.length){ body.innerHTML = '<div class="rep-note">Todos los resellers de las ventas actuales tienen destinatario. 👌</div>'; }
  else {

// botón "Reintentar fallidos" en la toolbar — visible sólo si hay envíos con error de mail
function sincRetryBtn(){

  (_data||[]).forEach(function(c){ (c.envios||[]).forEach(function(e){ if (e.mailError) n++; }); });
  var btn = document.getElementById('btn-retry-all');
  if (!btn) return;
  if (n > 0){ btn.style.display = 'inline-flex'; btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Reintentar '+n+' fallido'+(n===1?'':'s'); }

// indicador "Listos para enviar" en la toolbar
// lista de envíos listos para enviar: [{idVenta, envio}]
function listaListos(){
  var out = [];
  (_data||[]).forEach(function(c){ (c.envios||[]).forEach(function(e){ if (esReady(c,e)) out.push({ idVenta: c.idVenta, envio: e.envio }); }); });
  return out;
}
function sincReadyBtn(){
  var n = listaListos().length;
  var sb = document.getElementById('btn-send-ready');
  if (!sb) return;
  if (n >= 1){ sb.style.display = 'inline-flex'; sb.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar '+n+' listo'+(n===1?'':'s'); }
  else sb.style.display = 'none';
}

// envía el mail de TODOS los envíos listos, secuencialmente (respeta rate-limit + auditoría)
function enviarTodosListos(){
  var lista = listaListos();
  if (!lista.length){ toast('No hay envíos listos', '', 'ℹ️'); return; }
  uiConfirm('Vas a enviar el mail de despacho de '+lista.length+' envío'+(lista.length===1?'':'s')+' listo'+(lista.length===1?'':'s')+'.\n¿Confirmás?', { yes:'Enviar todos' }).then(function(ok){
    if (!ok) return;
    var sb = document.getElementById('btn-send-ready');
    if (sb){ sb.classList.add('loading'); }
    var okN = 0, failN = 0, i = 0;
    var paso = function(){
      if (i >= lista.length){
        if (sb) sb.classList.remove('loading');
        toast(okN+' enviado(s)'+(failN?' · '+failN+' con problema':''), failN?'':'ok', failN?'⚠️':'✅');
        cargar();
        return;
      }
      var it = lista[i++];
      toast('Enviando '+i+'/'+lista.length+'…', '', '✉️');
      google.script.run
        .withSuccessHandler(function(r){ if (r && r.ok) okN++; else failN++; paso(); })
        .withFailureHandler(function(){ failN++; paso(); })
        .CP_enviarMailEnvio(it.idVenta, it.envio);
    };
    paso();
  });
}

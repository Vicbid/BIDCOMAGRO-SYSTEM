<!-- @version 1.1 -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Facturación · Cobranza</title>
<style>
  :root{
    --blue:#00a3e0; --blue-d:#0089bd; --bg:#f4f6f8; --surf:#fff;
    --tx:#1a1f2e; --tx-d:#8a94a3; --brd:#e0e3e8; --green:#1a9e4a; --red:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,Segoe UI,Arial,sans-serif}
  header{background:var(--blue);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:800}
  header .sub{font-size:12px;opacity:.85}
  .wrap{max-width:920px;margin:0 auto;padding:16px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab-btn{padding:9px 16px;border-radius:8px;border:1px solid var(--brd);background:var(--surf);
    font-size:13px;font-weight:700;cursor:pointer;color:var(--tx-d)}
  .tab-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .card{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:16px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 0;border-bottom:1px solid var(--brd)}
  .row:last-child{border-bottom:none}
  .r-num{font-weight:800;font-family:monospace;font-size:13px}
  .r-cli{font-size:13px;color:var(--tx-d)}
  .r-monto{font-weight:800;font-size:14px}
  .r-fecha{font-size:11.5px;color:var(--tx-d)}
  .r-info{display:flex;flex-direction:column;gap:2px}
  .btn{padding:8px 14px;border-radius:8px;border:none;background:var(--green);color:#fff;
    font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .empty{text-align:center;color:var(--tx-d);padding:30px 10px;font-size:13.5px}
  .state{text-align:center;color:var(--tx-d);padding:30px 10px;font-size:13px}
  .refresh{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;
    border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;font-weight:700}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);
    color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:99}
  .toast.show{opacity:1}
  .toast.err{background:var(--red)}
  .r-sub{font-size:11.5px;color:var(--tx-d)}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
    align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal-overlay.show{display:flex}
  .modal{background:var(--surf);border-radius:12px;padding:20px;width:100%;max-width:380px}
  .modal h3{margin:0 0 4px;font-size:15px}
  .modal .modal-sub{font-size:12px;color:var(--tx-d);margin-bottom:14px}
  .modal label{display:block;font-size:12px;font-weight:700;color:var(--tx-d);margin:12px 0 4px}
  .modal input,.modal select{width:100%;padding:9px 10px;border:1px solid var(--brd);
    border-radius:8px;font-size:13.5px;font-family:inherit}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .btn-secondary{padding:8px 14px;border-radius:8px;border:1px solid var(--brd);background:var(--surf);
    color:var(--tx-d);font-weight:700;font-size:12.5px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div>
    <h1>Facturación · Cobranza</h1>
    <div class="sub">Pedidos de repuestos despachados por WOS</div>
  </div>
  <button class="refresh" onclick="cargar()"><i>⟳</i> Actualizar</button>
</header>
<div class="wrap">
  <div id="tabs" class="tabs" style="display:none">
    <button class="tab-btn" id="tab-fact" onclick="mostrar('facturar')">Pendiente facturar</button>
    <button class="tab-btn" id="tab-cobr" onclick="mostrar('cobrar')">Pendiente cobrar</button>
  </div>
  <div id="content" class="card"><div class="state">Cargando…</div></div>
</div>
<div id="toast" class="toast"></div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div class="modal-sub" id="modal-sub"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" id="modal-confirm" onclick="confirmarModal()">Confirmar</button>
    </div>
  </div>
</div>

<script>
var _rol = null;
var _vista = 'facturar';

function toast(msg, err){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(function(){ t.className = 'toast'; }, 2600);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); }

window.onload = function(){
  google.script.run
    .withSuccessHandler(function(rol){
      _rol = rol;
      if (!rol.esFacturacion && !rol.esCobranza){
        document.getElementById('content').innerHTML =
          '<div class="empty">No tenés acceso todavía' + (rol.email ? ' (' + esc(rol.email) + ')' : '') +
          '.<br>Pedile a Victor que agregue tu mail a FACTURACION_EMAILS o COBRANZA_EMAILS en la config.</div>';
        return;
      }
      if (rol.esFacturacion && rol.esCobranza){
        document.getElementById('tabs').style.display = 'flex';
      }
      _vista = rol.esFacturacion ? 'facturar' : 'cobrar';
      mostrar(_vista);
    })
    .withFailureHandler(function(e){
      document.getElementById('content').innerHTML = '<div class="empty">Error: ' + esc((e&&e.message)||'') + '</div>';
    })
    .FACT_getMiRol();
};

function mostrar(vista){
  _vista = vista;
  var tf = document.getElementById('tab-fact'), tc = document.getElementById('tab-cobr');
  if (tf) tf.classList.toggle('active', vista === 'facturar');
  if (tc) tc.classList.toggle('active', vista === 'cobrar');
  cargar();
}

function cargar(){
  document.getElementById('content').innerHTML = '<div class="state">Cargando…</div>';
  var fn = _vista === 'facturar' ? 'FACT_getPendientesFacturar' : 'FACT_getPendientesCobrar';
  google.script.run
    .withSuccessHandler(function(r){
      if (!r || !r.ok){
        document.getElementById('content').innerHTML = '<div class="empty">' + esc((r&&r.mensaje)||'No se pudo cargar la lista') + '</div>';
        return;
      }
      renderLista(r.pedidos || []);
    })
    .withFailureHandler(function(e){
      document.getElementById('content').innerHTML = '<div class="empty">Error: ' + esc((e&&e.message)||'') + '</div>';
    })
    [fn]();
}

var _pedidosActuales = {}; // numero -> item, para prellenar el modal sin serializar todo en el HTML

function renderLista(pedidos){
  var cont = document.getElementById('content');
  _pedidosActuales = {};
  (pedidos||[]).forEach(function(p){ _pedidosActuales[p.numero] = p; });
  if (!pedidos.length){
    cont.innerHTML = '<div class="empty">' +
      (_vista === 'facturar' ? '✅ No hay pedidos pendientes de facturar.' : '✅ No hay pedidos pendientes de cobrar.') +
      '</div>';
    return;
  }
  cont.innerHTML = pedidos.map(function(p){
    var fechaLbl, montoLbl, accion;
    if (_vista === 'facturar'){
      fechaLbl = p.fechaDespachoStr ? 'Despachado ' + esc(p.fechaDespachoStr) : '';
      montoLbl = esc(p.montoStr);
      accion = '<button class="btn" onclick="abrirModalFacturar(\''+esc(p.numero)+'\')">Marcar facturado</button>';
    } else {
      fechaLbl = (p.idVenta ? 'ID Venta ' + esc(p.idVenta) + ' · ' : '') +
        (p.facturadoFechaStr ? 'Facturado ' + esc(p.facturadoFechaStr) + (p.facturadoPor ? ' · ' + esc(p.facturadoPor) : '') : '');
      montoLbl = esc(p.montoFacturadoStr) + ' <span class="r-sub">facturado</span>';
      accion = '<button class="btn" onclick="abrirModalCobrar(\''+esc(p.numero)+'\')">Marcar cobrado</button>';
    }
    return '<div class="row">' +
      '<div class="r-info">' +
        '<span class="r-num">' + esc(p.numero) + ' <span style="font-weight:400;color:var(--tx-d)">('+esc(p.tipo)+')</span></span>' +
        '<span class="r-cli">' + esc(p.cliente || '—') + '</span>' +
        (fechaLbl ? '<span class="r-fecha">' + fechaLbl + '</span>' : '') +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:14px">' +
        '<span class="r-monto">' + montoLbl + '</span>' +
        accion +
      '</div>' +
    '</div>';
  }).join('');
}

/* ── Modal: marcar facturado (pide ID Venta de Masterchief + monto real facturado en USD;
   el monto viene prellenado con el BASE calculado, sin impuesto — cada reseller tiene un
   tratamiento impositivo distinto y hoy no está sistematizado, así que lo ajusta a mano
   quien factura) ── */
function abrirModalFacturar(numero){
  var p = _pedidosActuales[numero];
  if (!p) return;
  document.getElementById('modal-title').textContent = 'Marcar facturado — ' + numero;
  document.getElementById('modal-sub').textContent = 'Monto base sin impuesto (según lo despachado): ' + p.montoStr + '. Ajustá el monto real si corresponde aplicar impuesto.';
  document.getElementById('modal-body').innerHTML =
    '<label for="mf-idventa">ID Venta (Masterchief)</label>' +
    '<input id="mf-idventa" type="text" placeholder="Ej: 15861196">' +
    '<label for="mf-monto">Monto facturado (USD)</label>' +
    '<input id="mf-monto" type="number" step="0.01" min="0" value="' + (p.monto || '') + '">';
  document.getElementById('modal-confirm').onclick = function(){
    var idVenta = document.getElementById('mf-idventa').value.trim();
    var monto = document.getElementById('mf-monto').value;
    if (!idVenta){ toast('Falta el ID de venta', true); return; }
    if (!monto || Number(monto) <= 0){ toast('Falta el monto facturado', true); return; }
    guardarAccion('FACT_marcarFacturado', [numero, idVenta, Number(monto)], numero);
  };
  document.getElementById('modal-overlay').classList.add('show');
}

/* ── Modal: marcar cobrado (pide monto y moneda REALMENTE recibidos — puede no coincidir
   con lo facturado por tipo de cambio o pago en pesos) ── */
function abrirModalCobrar(numero){
  var p = _pedidosActuales[numero];
  if (!p) return;
  document.getElementById('modal-title').textContent = 'Marcar cobrado — ' + numero;
  document.getElementById('modal-sub').textContent = 'Facturado: ' + p.montoFacturadoStr + '. Cargá lo que realmente entró (puede ser en pesos y no coincidir 1 a 1).';
  document.getElementById('modal-body').innerHTML =
    '<label for="mc-monto">Monto cobrado</label>' +
    '<input id="mc-monto" type="number" step="0.01" min="0" value="' + (p.montoFacturado || '') + '">' +
    '<label for="mc-moneda">Moneda</label>' +
    '<select id="mc-moneda"><option value="ARS">ARS (pesos)</option><option value="USD">USD (dólares)</option></select>';
  document.getElementById('modal-confirm').onclick = function(){
    var monto = document.getElementById('mc-monto').value;
    var moneda = document.getElementById('mc-moneda').value;
    if (!monto || Number(monto) <= 0){ toast('Falta el monto cobrado', true); return; }
    guardarAccion('FACT_marcarCobrado', [numero, Number(monto), moneda], numero);
  };
  document.getElementById('modal-overlay').classList.add('show');
}

function cerrarModal(){
  document.getElementById('modal-overlay').classList.remove('show');
}

function guardarAccion(fn, args, numero){
  var btn = document.getElementById('modal-confirm');
  var orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Guardando…';
  var call = google.script.run
    .withSuccessHandler(function(r){
      btn.disabled = false; btn.textContent = orig;
      if (r && r.ok){ cerrarModal(); toast('Listo — ' + numero + ' actualizado.'); cargar(); }
      else { toast((r && r.mensaje) || 'No se pudo guardar', true); }
    })
    .withFailureHandler(function(e){ btn.disabled = false; btn.textContent = orig; toast('Error: ' + ((e&&e.message)||''), true); });
  call[fn].apply(call, args);
}
</script>
</body>
</html>
